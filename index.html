   <div class="interp-src ${zh?'zh':''}" style="text-align:left;${zh?'':'font-family:var(--sans);font-size:17px'}">${esc(st.src)}</div>
   ${zh?`<div class="dlg-pinyin">${esc(st.p||'')}</div><div style="margin-top:8px">${spkBtns(st.src)}</div>`:''}
   <button class="btn btn-primary" style="margin-top:12px" onclick="this.nextElementSibling.hidden=false;this.hidden=true">Mở đáp án mẫu</button>
   <div class="reveal-box" hidden>
    <div class="${zh?'':'zh'}" style="font-weight:600">${esc(st.ans)} ${zh?'':spkBtn(st.ans)}</div>${!zh&&st.p?`<div class="dlg-pinyin">${esc(st.p)}</div>`:''}
    <div class="srs-btns"><button class="btn btn-sm" onclick="MRATE(1)">Tạm ổn</button><button class="btn btn-sm btn-primary" onclick="MRATE(2)">Dịch tốt</button></div></div>`;
   window.MRATE=sc=>{score+=sc;$('#mNext').hidden=false;};
  }
  $('#mNext').onclick=()=>{i++;if(i<M.steps.length)draw();else finish();};
 };
 const finish=()=>{
  const pct=Math.round(score/max*100);
  S.done.mission[M.id]=pct;save();
  M.skills.forEach(s=>{if(S.skills[s]!=null)S.skills[s]=Math.min(100,+(S.skills[s]+4).toFixed(1))});
  addXP(M.xp*Math.max(.4,pct/100)|0);
  el.innerHTML=`<div class="card interp-card"><div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)">Mission Complete</div>
  <div class="score-big" style="color:var(--accent)">${pct}%</div>
  <p style="color:var(--ink2)">Bạn vừa dùng kỹ năng của ${M.skills.length} mảng: ${M.skills.map(s=>META.inds[s].name).join(' + ')}.</p>
  <div class="srs-btns"><button class="btn" onclick="GO('missions','${M.id}')">Làm lại</button><button class="btn btn-primary" onclick="GO('missions')">Về danh sách</button></div></div>`;
 };
 draw();
}

/* ================= DAY SIM ================= */
RENDER.daysim=el=>{
 const prog=el._p||{i:0,score:0,done:S.done.day.completed?DAYSIM.length:0};el._p=prog;
 el.innerHTML=pageHead('A Day at Work','上班','Một ngày đi làm · 一天上班','Từ 08:30 đến 17:30 — bảy mốc thời gian, dùng toàn bộ kỹ năng của một ngày làm việc thật. Hoàn thành lần lượt từng mốc.')+
 DAYSIM.map((s,i)=>{
  const state=i<prog.i?'done':i===prog.i?'now':'';
  return `<div class="timeline-slot ${state}">
   <div class="time-chip num">${s.time}</div>
   <div class="slot-icon zh-display">${s.icon}</div>
   <div class="card card-pad" style="flex:1;${i>prog.i?'opacity:.5':''}">
    <b>${esc(s.title)}</b> <span class="zh" style="color:var(--ink2);font-size:13px">${s.zh}</span>
    ${i===prog.i?`<div style="font-size:13.5px;color:var(--ink2);margin:8px 0">${esc(s.ctx)}</div><p style="font-size:13.5px;font-weight:600;margin-bottom:8px">${esc(s.q)}</p><div class="mcq-slot"></div><button class="btn btn-primary btn-sm" id="dayNext" hidden style="margin-top:6px">${i===DAYSIM.length-1?'Kết thúc ngày làm việc':'Mốc tiếp theo →'}</button>`
     :i<prog.i?`<div style="font-size:12.5px;color:var(--good);margin-top:4px">✓ Đã xử lý</div>`
     :`<div style="font-size:12.5px;color:var(--ink3);margin-top:4px">Hoàn thành mốc trước để mở</div>`}
   </div></div>`}).join('')+
 (prog.i>=DAYSIM.length?`<div class="card interp-card"><div class="score-big" style="color:var(--accent)">${Math.round(prog.score/(DAYSIM.length*2)*100)}%</div><p style="color:var(--ink2)">Hết ngày làm việc! 下班了，辛苦了！</p><div class="srs-btns"><button class="btn" onclick="DAYRESET()">Làm lại một ngày mới</button></div></div>`:'');
 const slot=el.querySelector('.mcq-slot');
 if(slot){mountMCQ(slot,DAYSIM[prog.i].opts,sc=>{prog.score+=sc;$('#dayNext').hidden=false;});
  $('#dayNext').onclick=()=>{prog.i++;if(prog.i>=DAYSIM.length){const pct=Math.round(prog.score/(DAYSIM.length*2)*100);S.done.day.completed=true;if(!(S.done.day.score>=pct))S.done.day.score=pct;if(pct>(S.done.day.score||0))S.done.day.score=pct;save();addXP(40,'office');}RENDER.daysim(el);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};}
};
window.DAYRESET=()=>{const el=$('#view-daysim');el._p={i:0,score:0};RENDER.daysim(el);};

/* ================= SRS REVIEW ================= */
const IVS=[1,3,7,16,35];
RENDER.review=el=>{
 const entries=Object.entries(S.saved);
 const due=entries.filter(([id,x])=>x.due<=Date.now());
 const byInd={};due.forEach(([id])=>{const w=VMAP[id];if(w){byInd[w.ind]=(byInd[w.ind]||0)+1}});
 const stat=st=>entries.filter(([id,x])=>st==='learning'?x.step===0:st==='review'?(x.step>0&&x.step<3):x.step>=3).length;
 el.innerHTML=pageHead('Spaced Repetition','复习','My Vocabulary · Ôn tập','Từ đã lưu quay lại đúng lúc bạn sắp quên: Lại (quên) → học lại từ đầu · Nhớ → giãn dần 1 → 3 → 7 → 16 → 35 ngày.')+
 `<div class="grid g4">
  <div class="card stat"><div class="stat-val num">${entries.length}</div><div class="stat-label">Tổng từ đã lưu</div></div>
  <div class="card stat"><div class="stat-val num" style="color:var(--warn)">${stat('learning')}</div><div class="stat-label">Learning</div></div>
  <div class="card stat"><div class="stat-val num" style="color:var(--mfg)">${stat('review')}</div><div class="stat-label">Review</div></div>
  <div class="card stat"><div class="stat-val num" style="color:var(--good)">${stat('mastered')}</div><div class="stat-label">Mastered</div></div></div>
 ${due.length?`<div class="card card-pad" style="margin-top:16px"><b>今天复习 · Đến hạn hôm nay: ${due.length} từ</b>
  <div style="font-size:13px;color:var(--ink2);margin:4px 0 10px">${Object.entries(byInd).map(([k,n])=>`${n} từ ${META.inds[k].name}`).join(' · ')}</div>
  <button class="btn btn-primary" onclick="SRSGO()">Bắt đầu ôn</button></div>`
 :entries.length?`<div class="card card-pad" style="margin-top:16px;color:var(--good)"><b>✓ Không còn từ đến hạn.</b> <span style="color:var(--ink2)">Quay lại vào ngày mai, hoặc lưu thêm từ mới từ kho Từ vựng.</span></div>`
 :`<div class="card card-pad" style="margin-top:16px"><b>Chưa có từ nào trong My Vocabulary.</b><div style="color:var(--ink2);font-size:13.5px;margin:6px 0 10px">Vào kho từ vựng, bấm ☆ trên những từ bạn muốn ghi nhớ.</div><button class="btn btn-primary btn-sm" onclick="GO('vocab')">Mở kho từ vựng</button></div>`}
 ${entries.length?`<div class="section-label">Danh sách đã lưu</div><div class="grid g3">${entries.map(([id])=>VMAP[id]?vocabCard(VMAP[id]):'').join('')}</div>`:''}`;
};
window.SRSGO=()=>{
 const el=$('#view-review');
 const queue=Object.entries(S.saved).filter(([id,x])=>x.due<=Date.now()).map(([id])=>id);
 let i=0,flip=false;
 const draw=()=>{
  if(i>=queue.length){addXP(5+queue.length,'chinese'?null:null);RENDER.review(el);toast('Ôn xong '+queue.length+' từ! 🎉');return;}
  const w=VMAP[queue[i]];
  el.innerHTML=`<div style="font-size:12.5px;color:var(--ink3);margin-bottom:10px" class="num">Ôn tập ${i+1}/${queue.length}</div>
  <div class="card srs-card" onclick="SRSFLIP()">
   <div class="srs-hanzi zh">${esc(w.h)}</div>
   ${flip?`<div class="pinyin" style="font-size:16px;margin-top:6px">${esc(w.p)}</div>
    <div style="font-size:18px;font-weight:700;margin-top:4px">${esc(w.v)}</div>
    ${w.ex?`<div style="margin-top:12px;font-size:14px" class="zh">${esc(w.ex[0])}</div><div class="vi" style="font-size:12.5px">${esc(w.ex[1])}</div>`:''}
    <div style="margin-top:10px">${spkBtns(w.h)}</div>`
   :`<div style="color:var(--ink3);margin-top:10px;font-size:13px">Nhớ nghĩa + cách đọc rồi bấm để lật</div>`}
  </div>
  ${flip?`<div class="srs-btns">
   <button class="btn" style="color:var(--bad)" onclick="SRSRATE(0)">Lại (quên)</button>
   <button class="btn" onclick="SRSRATE(1)">Nhớ</button>
   <button class="btn btn-primary" onclick="SRSRATE(2)">Quá dễ</button></div>`:''}`;
 };
 window.SRSFLIP=()=>{flip=true;const w=VMAP[queue[i]];speak(w.h);draw();};
 window.SRSRATE=g=>{
  const id=queue[i],x=S.saved[id];
  if(g===0){x.step=0;x.due=Date.now()+3600e3;}
  else{x.step=Math.min(IVS.length-1,(x.step||0)+(g===2?2:1));x.due=Date.now()+IVS[x.step]*86400e3;}
  save();S.skills.chinese=Math.min(100,+(S.skills.chinese+0.15).toFixed(2));
  i++;flip=false;draw();
 };
 draw();
};

 el.innerHTML=pageHead('Common Mistakes','纠错','Lỗi người Việt thường gặp','Tổng hợp từ chính các mục ⚠ trong kho từ vựng: thanh điệu, 的得地, 了, câu chữ 把/被, lượng từ, trật tự câu và khác biệt sách vở – công sở.')+
 MISTAKES.map(sec=>`<div class="card card-pad" style="margin-bottom:14px"><b style="font-size:15px">${esc(sec.title)}</b>
  ${sec.items.map(it=>`<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:13.5px">
   <div><span class="chip chip-nego">Sai / kém tự nhiên</span> <span class="zh">${esc(it[0])}</span></div>
   <div style="margin-top:5px"><span class="chip chip-good">Đúng</span> <span>${esc(it[1])}</span></div></div>`).join('')}</div>`).join('');
};

 el.innerHTML=pageHead('Progress','进度','Tiến độ & cấp bậc','Career XP tăng qua mọi hoạt động. Cấp bậc mô phỏng con đường thăng tiến thật: Intern → Professional Negotiator.')+
 `<div class="grid g2">
  <div class="card card-pad">
   <div style="display:flex;align-items:center;gap:14px"><span class="zh-display" style="font-size:34px;color:var(--accent)">${r[2].charAt(0)}</span>
   <div><b style="font-size:17px">${r[1]}</b> <span class="zh" style="color:var(--ink2)">${r[2]}</span><div class="num" style="font-size:13px;color:var(--ink3)">${S.xp} XP${nr?` — còn ${nr[0]-S.xp} XP lên ${nr[1]} ${nr[2]}`:''}</div></div></div>
   <div class="bar" style="margin-top:12px"><i style="width:${pctToNext}%"></i></div>
   <div class="section-label">Thang cấp bậc</div>
   ${META.ranks.map(x=>`<div class="score-row"><b style="width:190px">${x[1]} <span class="zh" style="color:var(--ink3)">${x[2]}</span></b><span class="num" style="color:${S.xp>=x[0]?'var(--good)':'var(--ink3)'}">${S.xp>=x[0]?'✓':x[0]+' XP'}</span></div>`).join('')}
  </div>
  <div class="card radar-wrap">${radarSVG(340)}
   <div style="width:100%">${Object.entries(S.skills).map(([k,v])=>{const names={chinese:'Chinese 中文',mfg:'Manufacturing 制造',office:'Office 办公',trade:'Import-Export 进出口',interp:'Interpreter 翻译',nego:'Negotiation 谈判'};
   return `<div class="score-row"><b style="width:170px">${names[k]}</b><div class="bar"><i style="width:${v}%"></i></div><span class="num">${Math.round(v)}%</span></div>`}).join('')}</div>
  </div></div>
 <div class="grid g4" style="margin-top:16px">
  <div class="card stat"><div class="stat-val num">${Object.keys(S.done.lesson).length}/${LESSONS.length}</div><div class="stat-label">Bài học</div></div>
  <div class="card stat"><div class="stat-val num">${Object.keys(S.done.mission).length}/${MISSIONS.length}</div><div class="stat-label">Missions</div></div>
  <div class="card stat"><div class="stat-val num">${Object.keys(S.done.scen).length}/${SCENARIOS.length}</div><div class="stat-label">Tình huống</div></div>
  <div class="card stat"><div class="stat-val num">${Object.keys(S.done.rp).length}/${ROLEPLAYS.length}</div><div class="stat-label">Roleplay</div></div>
 </div>
 <div class="card card-pad" style="margin-top:16px;font-size:13px;color:var(--ink2)">Ước lượng trình độ: ${S.skills.chinese<20?'HSK 1–2 · bắt đầu làm quen công sở':S.skills.chinese<45?'HSK 2–3 · giao tiếp công việc cơ bản':S.skills.chinese<70?'HSK 3–4 · làm việc độc lập trong môi trường tiếng Trung':'HSK 4+ · sẵn sàng họp và đàm phán'} — dựa trên hoạt động trong hệ thống, chỉ mang tính tham khảo.</div>`;
};

  if(EXTDONE[kind])return EXTDONE[kind](id);
 }
 return !!(S.done.road&&S.done.road[st.k]);

function shuffleA(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQuiz(spec){
 const mk=(prompt,sub,correct,pool)=>{
  const ds=shuffleA(pool.filter(x=>x!==correct&&x)).slice(0,3);
  const opts=shuffleA([correct,...ds]);
  return {prompt,sub,opts,a:opts.indexOf(correct)};
 };
 let qs=[];
 if(EXTQUIZ[spec.type])return EXTQUIZ[spec.type](mk,shuffleA);
 if(spec.type==='vocab'){
  let ws=V.filter(w=>w.ind===spec.ind&&(!spec.gs||spec.gs.includes(w.g)));
  const pool=ws.map(w=>w.v);
  qs=shuffleA(ws).slice(0,10).map(w=>mk(w.h,w.p,w.v,pool));
 }
 if(spec.type==='sent'){
  const ss=SENTENCES.filter(s=>s[3]===spec.ind);const pool=ss.map(s=>s[2]);
  qs=shuffleA(ss).slice(0,8).map(s=>mk(s[0],s[1],s[2],pool));
 }
 if(spec.type==='phrase'){
  const pool=PHRASES.map(p=>p[2]);
  qs=shuffleA(PHRASES).slice(0,8).map(p=>mk(p[0],p[1],p[2],pool));
 }
 if(spec.type==='dlg'){
  let lines=[];spec.ids.forEach(id=>{const d=DMAP[id];d&&d.lines.forEach(L=>{if(L[1].length>5&&L[3].length>8)lines.push(L);});});
  const pool=lines.map(L=>L[3]);
  qs=shuffleA(lines).slice(0,8).map(L=>mk(L[1],L[2],L[3],pool));
 }
 if(spec.type==='negoexpr'){
  let ex=[];NEGO.filter(n=>spec.ids.includes(n.id)).forEach(n=>ex=ex.concat(n.expr));
  const pool=ex.map(e=>e[2]);
  qs=shuffleA(ex).slice(0,8).map(e=>mk(e[0],e[1],e[2],pool));
 }
 if(spec.type==='interpq'){
  const set=INTERP.find(x=>x.id===spec.set);
  const poolVi=set.items.filter(x=>x.dir==='zv').map(x=>x.ans);
  const poolZh=set.items.filter(x=>x.dir==='vz').map(x=>x.ans);
  const extraVi=SENTENCES.map(s=>s[2]),extraZh=SENTENCES.map(s=>s[0]);
  qs=shuffleA(set.items).map(it=>{
   if(it.dir==='zv'){const q=mk(it.src,it.p||'',it.ans,poolVi.length>3?poolVi:poolVi.concat(extraVi));q.plain=false;return q;}
   const q=mk(it.src,'→ Chọn câu tiếng Trung dịch đúng',it.ans,poolZh.length>3?poolZh:poolZh.concat(extraZh));q.plain=true;q.zhOpts=true;return q;});
 }
 if(spec.type==='mist'){
  qs=shuffleA(MISTQUIZ).map(m=>{const opts=shuffleA(m.o.map((t,i)=>({t,ok:i===m.a})));return {prompt:m.p,sub:'',opts:opts.map(o=>o.t),a:opts.findIndex(o=>o.ok),plain:true};});
 }
 return qs;
}
window.ROADQUIZ=(i,k)=>{
 if(!stageUnlocked(i)){toast('🔒 Hoàn thành giai đoạn trước để mở khóa');return;}
 const st=ROADMAP2[i].steps.find(x=>x.k===k);
 const qs=buildQuiz(QUIZMAP[k]);
 if(!qs.length){toast('Không tạo được bài kiểm tra');return;}
 let idx=0,correct=0;
 window.__qa=()=>qs[idx]?qs[idx].a:-1;
 const draw=()=>{
  const q=qs[idx];
  $('#modalBox').innerHTML=`
  <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)">Kiểm tra chốt · cần đúng 100%</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px"><b style="font-size:15px">${esc(st.t)}</b><span class="num" style="font-size:12px;color:var(--ink3)">Câu ${idx+1}/${qs.length} · đúng ${correct}</span></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${idx/qs.length*100}%"></i></div>
  <div class="${q.plain?'':'zh'}" style="font-size:${q.plain?'15px':'24px'};font-weight:700;line-height:1.5">${esc(q.prompt)}</div>
  ${q.sub&&!q.plain?`<div class="dlg-pinyin" style="margin:2px 0 4px">${esc(q.sub)}</div>`:''}
  <div style="margin-top:12px">${q.opts.map((o,j)=>`<button class="mcq-opt" onclick="QANS(this,${j})"><span class="key">${'ABCD'[j]}</span><span class="${q.zhOpts?'zh':''}" style="font-size:${q.zhOpts?'15px':'13.5px'}">${esc(o)}</span></button>`).join('')}</div>
  <div class="q-fb"></div>`;
  $('#modalScrim').classList.add('show');
 };
 window.QANS=(btn,j)=>{
  const q=qs[idx];const box=btn.parentElement;
  if(box._done)return;box._done=true;
  [...box.children].forEach(b=>b.disabled=true);
  const ok=j===q.a;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)box.children[q.a].classList.add('correct');
  if(ok)correct++;
  setTimeout(()=>{idx++;if(idx<qs.length)draw();else finish();},ok?500:1400);
 };
 const finish=()=>{
  const pass=correct===qs.length;
  if(pass){S.done.road=S.done.road||{};S.done.road[k]=true;save();addXP(12);}
  $('#modalBox').innerHTML=`<div style="text-align:center;padding:10px 0">
   <div class="score-big" style="color:${pass?'var(--good)':'var(--bad)'}">${correct}/${qs.length}</div>
   <b style="font-size:16px">${pass?'✓ Đạt 100% — bước này đã hoàn thành!':'Chưa đạt 100%'}</b>
   <p style="color:var(--ink2);font-size:13.5px;margin-top:6px">${pass?'Bước tiếp theo đã sẵn sàng trong lộ trình.':'Cần đúng toàn bộ mới được tính ✓. Ôn lại phần này rồi kiểm tra lại — câu hỏi sẽ được xáo trộn.'}</p>
   <div class="srs-btns">
    ${pass?`<button class="btn btn-primary" onclick="closeModal();GO('roadmap')">Về lộ trình →</button>`
    :`<button class="btn" onclick="closeModal();ROADGO(${i},'${k}')">Ôn lại</button><button class="btn btn-primary" onclick="ROADQUIZ(${i},'${k}')">Kiểm tra lại</button>`}
   </div></div>`;
 };
 draw();
};
function stageDone(i){return ROADMAP2[i].steps.every(stepDone)}
function stageUnlocked(i){return S.freeMode||i===0||stageDone(i-1)}
function nextRoadStep(){
 for(let i=0;i<ROADMAP2.length;i++){if(!stageUnlocked(i))break;
  for(const st of ROADMAP2[i].steps){if(!stepDone(st))return {stage:i,st};}}
 return null;
}

function stepWords(sp){return V.filter(w=>w.ind===sp.ind&&(!sp.gs||sp.gs.includes(w.g)));}

 }
 if(sp.type==='phrase'){

 }
 if(sp.type==='dlg')return sp.ids.map(id=>dlgCardHTML(DMAP[id])).join('');

 if(sp.type==='negoexpr'){
  return NEGO.filter(n=>sp.ids.includes(n.id)).map(n=>`
   <div class="section-label">${n.name} · ${n.zh}</div>

   <div class="card card-pad" style="margin-top:10px;border-left:3px solid var(--warn);font-size:13px">${esc(n.tips)}</div>`).join('');
 }
 if(sp.type==='interpq'){
  setTimeout(()=>{const box=$('#stepInterp');if(box){const set=INTERP.find(x=>x.id===sp.set);runInterp(box,set.items,()=>{});}},0);
  return `<div class="card card-pad" style="margin-bottom:12px;font-size:13px;color:var(--ink2)">Luyện trước — dịch thành tiếng từng câu, tự chấm. Sau đó làm bài kiểm tra chốt (chọn bản dịch đúng, cần 100%).</div><div id="stepInterp"></div>`;
 }
 return '';
}

 ROADMAP2.map((sg,i)=>{

function buildHelp(){
 document.body.insertAdjacentHTML('beforeend',`
 <button class="help-fab" id="helpFab" aria-label="Trợ giúp" title="Trợ giúp 帮助">?</button>
 <aside class="help-panel" id="helpPanel" aria-label="Bảng trợ giúp">
  <div class="help-head">
   <span class="zh-display" style="font-size:22px;color:var(--accent)">帮</span>
   <div style="flex:1"><b>Trợ giúp · 帮助</b><div style="font-size:11.5px;color:var(--ink3)">Bấm câu hỏi để xem hướng dẫn</div></div>
   <button class="modal-close" style="position:static" onclick="toggleHelp(false)">✕</button>
  </div>
  <div class="help-body" id="helpBody"></div>
 </aside>`);
 $('#helpFab').onclick=()=>toggleHelp();
 renderHelp();
}
window.toggleHelp=force=>{
 const p=$('#helpPanel');
 const open=force!=null?force:!p.classList.contains('open');
 p.classList.toggle('open',open);
 if(open)renderHelp();
};
function renderHelp(){
 const body=$('#helpBody');if(!body)return;
 const ctx=HELP.filter(h=>h.v===currentView);
 const rest=HELP.filter(h=>h.v!==currentView);
 const item=(h,ctxFlag)=>`<div class="help-item ${ctxFlag?'help-ctx':''}">
  <button class="help-q" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${ctxFlag?'📍 ':''}${h.q}<span style="margin-left:auto;color:var(--ink3)">▾</span></button>
  <div class="help-a" ${ctxFlag?'':'hidden'}>${h.a}${h.go?`<div style="margin-top:8px"><button class="btn btn-sm btn-primary" onclick="toggleHelp(false);GO('${h.go[0]}'${h.go[1]?`,'${h.go[1]}'`:''})">Đưa tôi đến đó →</button></div>`:''}</div></div>`;
 body.innerHTML=(ctx.length?`<div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px">Về trang bạn đang xem</div>${ctx.map(h=>item(h,true)).join('')}<div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:14px 0 8px">Tất cả hướng dẫn</div>`:'')+rest.map(h=>item(h,false)).join('');
}

function showOnboarding(){
 let i=0;
 const draw=()=>{
  const o=OB[i];
  $('#modalBox').innerHTML=`
  <div style="text-align:center;padding:6px 0">
   <div class="ob-hanzi">${o.h}</div>
   <b style="font-size:19px;display:block;margin:10px 0 8px">${o.t}</b>

   <div class="ob-dots">${OB.map((x,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
   <div class="srs-btns" style="margin-top:20px">
    ${i>0?`<button class="btn" onclick="OBGO(${i-1})">← Trước</button>`:`<button class="btn btn-ghost" onclick="OBEND(false)">Bỏ qua</button>`}
    ${i<OB.length-1?`<button class="btn btn-primary" onclick="OBGO(${i+1})">Tiếp →</button>`:`<button class="btn btn-primary" onclick="OBEND(true)">Bắt đầu học theo lộ trình →</button>`}
   </div></div>`;
  $('#modalScrim').classList.add('show');
 };
 window.OBGO=j=>{i=j;draw()};
 window.OBEND=goRoad=>{S.onboarded=true;save();closeModal();if(goRoad)GO('roadmap');};
 draw();
}

<script>
/* ================= HANZI WRITER LOADER (có dự phòng) ================= */
let HWstate='idle', HWpromise=null;
function loadHW(){
 if(HWpromise)return HWpromise;
 HWpromise=new Promise((res,rej)=>{
  if(window.HanziWriter){HWstate='ok';return res(true);}
  HWstate='loading';
  const srcs=['https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.5.0/hanzi-writer.min.js',
              'https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js',
              'https://unpkg.com/hanzi-writer@3.5.0/dist/hanzi-writer.min.js'];
  let i=0;
  const tryNext=()=>{
   if(i>=srcs.length){HWstate='fail';return rej(new Error('cdn'));}
   const s=document.createElement('script');s.src=srcs[i++];
   s.onload=()=>{if(window.HanziWriter){HWstate='ok';res(true);}else tryNext();};
   s.onerror=tryNext;
   document.head.appendChild(s);
  };
  tryNext();
 });
 return HWpromise;
}
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#B93A2B'}
const HWOPT=()=>({width:200,height:200,padding:6,showOutline:true,showCharacter:false,
 strokeAnimationSpeed:1,delayBetweenStrokes:280,delayBetweenLoops:1400,
 strokeColor:tok('--accent'),outlineColor:tok('--border2'),radicalColor:tok('--mfg'),
 drawingColor:tok('--accent'),drawingWidth:22,highlightColor:tok('--good')});
const _writers=[];
function clearWriters(){_writers.forEach(w=>{try{w.hideCharacter&&w.cancelQuiz&&w.cancelQuiz()}catch(e){}});_writers.length=0;}
/* Tạo 1 ô viết chữ. mode: 'anim' | 'quiz' */
function mountHZ(box,ch,mode,cb){
 box.innerHTML='<div style="display:grid;place-items:center;height:100%;color:var(--ink3);font-size:12px">Đang tải…</div>';
 loadHW().then(()=>{
  box.innerHTML='<div class="hz-grid"></div>';
  const w=HanziWriter.create(box,ch,HWOPT());
  _writers.push(w);
  if(mode==='quiz'){
   let mistakes=0;
   w.quiz({showHintAfterMisses:2,
    onMistake:()=>{mistakes++;if(cb)cb('mistake',mistakes);},
    onComplete:d=>{if(cb)cb('done',d.totalMistakes);}});
  }else{
   w.loopCharacterAnimation();
  }
  if(cb)cb('ready',w);
 }).catch(()=>{
  const w=box.clientWidth||120, big=w>130;
  box.innerHTML=`<div class="hz-fallback"><div style="font-family:'Noto Serif SC',serif;font-weight:900;line-height:1;font-size:${Math.max(22,Math.round(w*0.42))}px">${esc(ch)}</div>${big?'<div style="font-size:10px;color:var(--ink3);margin-top:6px">cần internet để xem nét</div>':''}</div>`;
  if(cb)cb('fail');
  if(!window._hwWarned){window._hwWarned=true;
   if(currentView==='write')setTimeout(()=>{const v=$('#view-write');if(v)RENDER.write(v);},60);}
 });
}
/* ================= CHI TIẾT MỘT CHỮ ================= */
window.openChar=ch=>{
 const info=HV[ch]||{p:'',hv:'—',m:''};
 const words=(CHARWORDS[ch]||[]).slice(0,10).map(id=>VMAP[id]).filter(Boolean);
 const rad=RADICALS.find(r=>r[5].split(' ').includes(ch));
 const okMark=S.write&&S.write.ok&&S.write.ok[ch];
 $('#modalBox').innerHTML=`
  <button class="modal-close" onclick="closeModal()" aria-label="Đóng">✕</button>
  <div style="display:flex;gap:18px;flex-wrap:wrap">
   <div style="flex:0 0 200px;max-width:200px">
     <div class="hz-box" id="hzMain"></div>
     <div class="hz-tools">
      <button class="btn btn-sm" onclick="HZACT('anim')">▶ Xem lại</button>
      <button class="btn btn-sm" onclick="HZACT('slow')">🐢 Chậm</button>
      <button class="btn btn-sm btn-primary" onclick="HZACT('quiz')">✍ Tự viết thử</button>
     </div>
     <div id="hzMsg" style="font-size:12px;text-align:center;margin-top:8px;min-height:18px;color:var(--ink3)">${okMark?'<span style="color:var(--good);font-weight:700">✓ Bạn đã viết đúng chữ này</span>':''}</div>
   </div>
   <div style="flex:1;min-width:220px">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
     <span class="zh" style="font-size:34px;font-weight:900">${esc(ch)}</span>
     <span class="pinyin" style="font-size:16px">${esc(info.p)}</span>
     ${spkBtn(ch)}
    </div>
    <div style="margin-top:6px"><span class="chip chip-nego" style="font-size:13px;letter-spacing:.04em">âm Hán Việt: ${esc(info.hv)}</span>
    <span id="hzCount" class="chip chip-core"></span></div>
    <div style="font-size:13.5px;color:var(--ink2);margin-top:8px">Nghĩa gốc: <b style="color:var(--ink)">${esc(info.m||'—')}</b></div>
    ${rad?`<div class="mrow"><b>Bộ thủ</b><div><span class="zh" style="font-size:18px">${esc(rad[0])}</span> ${esc(rad[1])} · <b>${esc(rad[2])}</b> — ${esc(rad[3])}<div style="font-size:12.5px;color:var(--ink2);margin-top:2px">${esc(rad[4])}</div></div></div>`:''}
    ${words.length?`<div class="mrow"><b>Từ dùng chữ này</b><div>${words.map(w=>`<span class="rel-chip" onclick="closeModal();openVocab('${w.id}')">${esc(w.h)} <span style="color:var(--ink3);font-size:11px">${esc(w.v)}</span></span>`).join('')}</div></div>`:''}
    <div class="mrow"><b>Mẹo nhớ</b><div style="font-size:13px">Người Việt có lợi thế lớn: âm Hán Việt <b>${esc(info.hv)}</b> chính là "cầu nối" — gặp chữ này trong từ mới, hãy đọc thầm âm Hán Việt trước, nghĩa sẽ hiện ra ngay.</div></div>
   </div>
  </div>`;
 $('#modalScrim').classList.add('show');
 const box=$('#hzMain');
 window.HZACT=act=>{
  const msg=$('#hzMsg');
  if(act==='quiz'){
   msg.innerHTML='Dùng chuột/ngón tay viết theo đúng thứ tự nét…';
   mountHZ(box,ch,'quiz',(ev,val)=>{
    if(ev==='mistake')msg.innerHTML=`<span style="color:var(--warn)">Sai nét ${val} lần — sai 2 lần sẽ có gợi ý</span>`;
    if(ev==='done'){
     S.write=S.write||{ok:{},tries:{}};S.write.tries[ch]=(S.write.tries[ch]||0)+1;
     if(val===0){S.write.ok[ch]=true;addXP(3);msg.innerHTML='<span style="color:var(--good);font-weight:700">✓ Hoàn hảo! Không sai nét nào.</span>';}
     else msg.innerHTML=`<span style="color:var(--warn)">Xong — sai ${val} nét. Viết lại cho tới khi không sai nét nào nhé.</span>`;
     save();
    }
   });
  }else{
   msg.innerHTML=act==='slow'?'Đang chạy chậm để bạn nhìn rõ từng nét':'';
   if(act==='slow'){
    box.innerHTML='<div style="display:grid;place-items:center;height:100%;color:var(--ink3);font-size:12px">Đang tải…</div>';
    loadHW().then(()=>{box.innerHTML='<div class="hz-grid"></div>';
     const w=HanziWriter.create(box,ch,Object.assign(HWOPT(),{strokeAnimationSpeed:0.3,delayBetweenStrokes:950}));
     _writers.push(w);w.loopCharacterAnimation();}).catch(()=>mountHZ(box,ch,'anim'));
   }else mountHZ(box,ch,'anim');
  }
 };
 HZACT('anim');
 loadHW().then(()=>HanziWriter.loadCharacterData(ch)).then(d=>{
  const el=$('#hzCount');if(el&&d&&d.strokes)el.textContent=d.strokes.length+' nét';
 }).catch(()=>{});
};
/* ================= VIEW: VIẾT CHỮ HÁN ================= */
const WTABS=[['basics','Nét & quy tắc','笔顺'],['radical','Bộ thủ','部首'],['lookup','Tra chữ','查字'],['practice','Luyện viết','练字']];
RENDER.write=(el,param)=>{
 clearWriters();
 if(typeof param==='string')el._tab=param;
 const tab=el._tab||'basics';
 const okN=Object.keys((S.write&&S.write.ok)||{}).length;
 let body='';
 if(tab==='basics')body=writeBasicsHTML();
 if(tab==='radical')body=writeRadicalHTML();
 if(tab==='lookup')body=writeLookupHTML(el);
 if(tab==='practice')body=writePracticeHTML(el);
 el.innerHTML=pageHead('Writing System · 书写','书','Cách viết từng chữ Hán',
  'Viết tay đúng bút thuận không chỉ để chữ đẹp: nó giúp bạn NHỚ chữ lâu hơn nhiều lần, đọc được chữ viết tay của đồng nghiệp Trung Quốc, và tra được từ điển. Kho chữ: '+ALLCHARS.length+' chữ Hán trong toàn bộ từ vựng — mỗi chữ có video nét viết, số nét, âm Hán Việt và ô tập viết.')+
 `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
   <div class="toggle-row" style="margin:0">${WTABS.map(t=>`<button class="toggle ${tab===t[0]?'on':''}" onclick="GO('write','${t[0]}')">${t[1]} <span class="zh" style="opacity:.6">${t[2]}</span></button>`).join('')}</div>
   <span class="chip chip-good num" style="margin-left:auto">✍ Đã viết đúng ${okN}/${ALLCHARS.length} chữ</span>
  </div>${body}`;
 if(tab==='basics')mountBasics();
 if(tab==='radical')mountRadicals();
 if(tab==='lookup')mountLookup(el);
 if(tab==='practice')mountPractice(el);
};
function hwWarn(){return HWstate==='fail'?`<div class="hz-warn">⚠ Không tải được thư viện nét chữ (cần kết nối internet). Bạn vẫn xem được quy tắc bút thuận, bộ thủ và âm Hán Việt bên dưới — phần video nét viết sẽ hoạt động lại khi có mạng.</div>`:''}

 return hwWarn()+
 `<div class="card card-pad" style="border-left:4px solid var(--accent);margin-bottom:18px">

   <div style="font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.7">
   ① <b>Nhớ lâu hơn</b> — tay viết một lần bằng mắt nhìn năm lần. ② <b>Đọc được chữ viết tay</b> của quản lý Trung Quốc trên phiếu giao ca, bản vẽ, ghi chú. ③ <b>Ký và điền biểu mẫu</b> — 签字, 填表 là việc hằng ngày. ④ <b>Phân biệt chữ gần giống</b>: 木/本, 目/日, 白/百, 千/干 — chỉ khi tự viết bạn mới không lẫn.</div></div>

    </div></div>`).join('')}</div>
  <div class="card card-pad" style="margin-top:16px;font-size:13px;color:var(--ink2)">
   <b>Mẹo luyện tay:</b> viết mỗi chữ mới 5 lần trên giấy ô ly (田字格) ngay khi học từ đó — nhiều hơn 5 lần là phí thời gian, ít hơn thì không đọng lại. Sau đó dùng ô <b>✍ Tự viết thử</b> trong app để kiểm tra thứ tự nét.</div>`;
}

function writeRadicalHTML(){
 return hwWarn()+
 `<div class="card card-pad" style="border-left:4px solid var(--mfg);margin-bottom:18px">
   <b>Bộ thủ = "gốc nghĩa" của chữ Hán</b>

function writeLookupHTML(el){
 const f=el._lf||{q:'',ind:'all',lv:0};el._lf=f;
 let cs=ALLCHARS;
 if(f.ind!=='all'){const set=new Set();V.filter(w=>w.ind===f.ind&&(f.lv===0||w.lv===f.lv)).forEach(w=>[...w.h].forEach(c=>set.add(c)));cs=cs.filter(c=>set.has(c));}
 else if(f.lv){const set=new Set();V.filter(w=>w.lv===f.lv).forEach(w=>[...w.h].forEach(c=>set.add(c)));cs=cs.filter(c=>set.has(c));}
 if(f.q){const q=f.q.toLowerCase();cs=cs.filter(c=>c===f.q||((HV[c]||{}).p||'').toLowerCase().includes(q)||((HV[c]||{}).hv||'').toLowerCase().includes(q)||((HV[c]||{}).m||'').toLowerCase().includes(q));}
 const shown=cs.slice(0,240);
 return hwWarn()+
 `<div class="vfilters">
   <input class="vsearch" placeholder="Tìm chữ Hán / pinyin / âm Hán Việt / nghĩa…" value="${esc(f.q)}" oninput="WLQ(this.value)">
   ${['all','core','mfg','office','trade','interp','nego'].map(i=>`<button class="vfilter ${f.ind===i?'active':''}" onclick="WLI('${i}')">${i==='all'?'Tất cả':META.inds[i].name}</button>`).join('')}
   ${[0,1,2,3].map(l=>`<button class="vfilter ${f.lv===l?'active':''}" onclick="WLL(${l})">${l===0?'Mọi cấp':'L'+l}</button>`).join('')}
  </div>
  <div style="font-size:12.5px;color:var(--ink3);margin-bottom:10px" class="num">${cs.length} chữ${cs.length>240?' · hiển thị 240 chữ đầu, hãy dùng ô tìm kiếm':''}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">
   ${shown.map(c=>{const i=HV[c]||{};const ok=S.write&&S.write.ok&&S.write.ok[c];
    return `<div class="card hz-card" onclick="openChar('${c}')" title="${esc(i.m||'')}">
     <div class="hz-char">${esc(c)}</div>
     <div class="pinyin" style="font-size:11.5px">${esc(i.p||'')}</div>
     <div class="hz-hv">${esc(i.hv||'—')}</div>
     <div style="font-size:10.5px;color:var(--ink3);margin-top:2px">${ok?'<span style="color:var(--good)">✓ đã viết đúng</span>':(CHARFREQ[c]+' từ')}</div>
    </div>`}).join('')||'<div class="empty">Không tìm thấy chữ phù hợp.</div>'}
  </div>`;
}
function mountLookup(){}
window.WLI=i=>{const el=$('#view-write');el._lf.ind=i;RENDER.write(el,'lookup')};
window.WLL=l=>{const el=$('#view-write');el._lf.lv=l;RENDER.write(el,'lookup')};
let _wlq;window.WLQ=v=>{clearTimeout(_wlq);_wlq=setTimeout(()=>{const el=$('#view-write');el._lf.q=v;RENDER.write(el,'lookup');const inp=el.querySelector('.vsearch');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}},260)};

/* ===== LUYỆN VIẾT ===== */
function practiceSets(){
 const saved=[...new Set(Object.keys(S.saved).flatMap(id=>[...(VMAP[id]||{h:''}).h]))].filter(c=>CHARFREQ[c]);
 const byInd=ind=>{const set=new Set();V.filter(w=>w.ind===ind).forEach(w=>[...w.h].forEach(c=>set.add(c)));return ALLCHARS.filter(c=>set.has(c)).slice(0,24);};
 return [
  {id:'top20',name:'20 chữ thông dụng nhất',zh:'最常用20字',chars:ALLCHARS.slice(0,20)},
  {id:'l1',name:'Chữ trong từ L1 Essential',zh:'基础字',chars:(()=>{const s=new Set();V.filter(w=>w.lv===1).forEach(w=>[...w.h].forEach(c=>s.add(c)));return ALLCHARS.filter(c=>s.has(c)).slice(0,24)})()},
  {id:'saved',name:'Chữ trong My Vocabulary',zh:'我的生词',chars:saved.slice(0,24)},
  {id:'mfg',name:'Chữ ngành Sản xuất',zh:'制造业',chars:byInd('mfg')},
  {id:'trade',name:'Chữ ngành Xuất nhập khẩu',zh:'进出口',chars:byInd('trade')},
  {id:'office',name:'Chữ Văn phòng',zh:'办公室',chars:byInd('office')}
 ];
}
function writePracticeHTML(el){
 const sets=practiceSets();
 const cur=el._pset;
 if(!cur){
  return hwWarn()+
  `<div class="card card-pad" style="border-left:4px solid var(--good);margin-bottom:18px">
    <b>Luyện viết = tự vẽ từng nét, app chấm đúng/sai</b>
    <div style="font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.7">Dùng chuột (máy tính) hoặc ngón tay (điện thoại) viết theo đúng <b>thứ tự nét</b>. Sai 2 lần một nét sẽ có gợi ý. Chỉ khi viết xong <b>không sai nét nào</b> chữ mới được tính ✓ — đó cũng là điều kiện hoàn thành bước "Luyện viết" trong Lộ trình.</div></div>
   <div class="grid g3">${sets.map(s=>{
    const done=s.chars.filter(c=>S.write&&S.write.ok&&S.write.ok[c]).length;
    return `<div class="card card-pad" style="cursor:${s.chars.length?'pointer':'default'};opacity:${s.chars.length?1:.5}" ${s.chars.length?`onclick="WPSET('${s.id}')"`:''}>
     <b>${esc(s.name)}</b> <span class="zh" style="color:var(--ink2);font-size:13px">${esc(s.zh)}</span>
     <div style="font-size:12.5px;color:var(--ink2);margin-top:6px" class="num">${s.chars.length} chữ · đã viết đúng ${done}</div>
     <div class="bar" style="margin-top:8px"><i style="width:${s.chars.length?Math.round(done/s.chars.length*100):0}%"></i></div>
     ${!s.chars.length?'<div style="font-size:12px;color:var(--ink3);margin-top:6px">Hãy lưu vài từ vào My Vocabulary trước</div>':''}
    </div>`}).join('')}</div>`;
 }
 const set=sets.find(s=>s.id===cur.id);const ch=set.chars[cur.i];
 return `<button class="btn btn-ghost btn-sm" onclick="WPBACK()">← Chọn bộ khác</button>
  <div class="card card-pad" style="max-width:520px;margin:12px auto;text-align:center">
   <div style="font-size:12px;color:var(--ink3)" class="num">${esc(set.name)} · chữ ${cur.i+1}/${set.chars.length}</div>
   <div class="bar" style="margin:8px 0 14px"><i style="width:${cur.i/set.chars.length*100}%"></i></div>
   <div style="display:flex;justify-content:center"><div class="hz-box" id="wpBox"></div></div>
   <div style="margin-top:12px">
    <span class="pinyin" style="font-size:15px">${esc((HV[ch]||{}).p||'')}</span>
    <span class="chip chip-nego" style="margin-left:6px">${esc((HV[ch]||{}).hv||'')}</span>
    <div style="font-size:13px;color:var(--ink2);margin-top:4px">${esc((HV[ch]||{}).m||'')}</div>
   </div>
   <div id="wpMsg" style="min-height:22px;margin-top:10px;font-size:13px;color:var(--ink3)">Viết chữ này theo đúng thứ tự nét</div>
   <div class="hz-tools">
    <button class="btn btn-sm" onclick="WPHINT()">💡 Xem nét mẫu</button>
    <button class="btn btn-sm" onclick="WPRETRY()">↻ Viết lại</button>
    <button class="btn btn-sm btn-primary" onclick="WPNEXT()">Chữ tiếp →</button>
   </div>
  </div>`;
}
function mountPractice(el){
 const cur=el._pset;if(!cur)return;
 const set=practiceSets().find(s=>s.id===cur.id);const ch=set.chars[cur.i];
 const box=$('#wpBox');if(!box)return;
 const msg=$('#wpMsg');
 mountHZ(box,ch,'quiz',(ev,val)=>{
  if(ev==='mistake')msg.innerHTML=`<span style="color:var(--warn)">Sai nét ${val} lần${val>=2?' — đã bật gợi ý':''}</span>`;
  if(ev==='done'){
   S.write=S.write||{ok:{},tries:{}};S.write.tries[ch]=(S.write.tries[ch]||0)+1;
   if(val===0){S.write.ok[ch]=true;addXP(3);msg.innerHTML='<span style="color:var(--good);font-weight:700">✓ Hoàn hảo, không sai nét nào!</span>';}
   else msg.innerHTML=`<span style="color:var(--warn)">Xong nhưng sai ${val} nét — bấm ↻ viết lại để đạt ✓</span>`;
   save();
  }
 });
}
window.WPSET=id=>{const el=$('#view-write');el._pset={id,i:0};RENDER.write(el,'practice')};
window.WPBACK=()=>{const el=$('#view-write');el._pset=null;RENDER.write(el,'practice')};
window.WPRETRY=()=>{const el=$('#view-write');mountPractice(el)};
window.WPNEXT=()=>{const el=$('#view-write');const set=practiceSets().find(s=>s.id===el._pset.id);
 if(el._pset.i+1>=set.chars.length){el._pset=null;toast('Hoàn thành bộ luyện viết! 🎉');RENDER.write(el,'practice');return;}
 el._pset.i++;RENDER.write(el,'practice');};
window.WPHINT=()=>{const el=$('#view-write');const set=practiceSets().find(s=>s.id===el._pset.id);const ch=set.chars[el._pset.i];
 const box=$('#wpBox');mountHZ(box,ch,'anim');$('#wpMsg').innerHTML='Xem mẫu xong bấm <b>↻ Viết lại</b> để tự viết';};

/* ================= TÍCH HỢP: nút "cách viết" trong thẻ từ ================= */
const _openVocab0=window.openVocab;
window.openVocab=id=>{
 _openVocab0(id);
 const w=VMAP[id];if(!w)return;
 const chars=[...w.h].filter(c=>c>='一'&&c<='鿿');
 if(!chars.length)return;
 const box=$('#modalBox');
 box.insertAdjacentHTML('beforeend',
  `<div class="mrow"><b>Cách viết</b><div>
   <div style="font-size:12.5px;color:var(--ink2);margin-bottom:6px">Bấm từng chữ để xem thứ tự nét, số nét và tự viết thử:</div>
   ${chars.map(c=>`<button class="hz-mini" onclick="openChar('${c}')"><b>${esc(c)}</b><span>${esc((HV[c]||{}).hv||'')}</span></button>`).join('')}
   <div style="font-size:12.5px;color:var(--ink2);margin-top:8px">Âm Hán Việt cả từ: <b style="color:var(--accent-ink);letter-spacing:.03em">${chars.map(c=>(HV[c]||{}).hv||'?').join(' ')}</b></div>
  </div></div>`);
};

/* ================= TÍCH HỢP LỘ TRÌNH ================= */
QUIZMAP.s1f={type:'stroke'};
QUIZMAP.s2f={type:'radical'};
EXTDONE.write=n=>Object.keys((S.write&&S.write.ok)||{}).length>=+n;
EXTQUIZ.stroke=(mk,sh)=>sh(WQUIZ_STROKE).slice(0,10).map(q=>{const opts=sh(q[1].map((t,i)=>({t,ok:i===q[2]})));return {prompt:q[0],sub:'',opts:opts.map(o=>o.t),a:opts.findIndex(o=>o.ok),plain:true};});
EXTQUIZ.radical=(mk,sh)=>{
 const pool=RADICALS.map(r=>r[3]);
 const qs=sh(RADICALS).slice(0,6).map(r=>{const q=mk(r[0]+'  ( '+r[1]+' )','Bộ thủ này gợi ý nghĩa gì?',r[3],pool);q.plain=true;return q;});
 const hvPool=ALLCHARS.slice(0,120).map(c=>(HV[c]||{}).hv).filter(Boolean);
 const hvq=sh(ALLCHARS.slice(0,80)).slice(0,4).map(c=>{const q=mk(c,'Âm Hán Việt của chữ này là gì?',(HV[c]||{}).hv,hvPool);return q;});
 return qs.concat(hvq);
};
EXTOUT.stroke=()=>['Gọi tên và viết đúng 8 nét cơ bản (ngang, sổ, phẩy, mác, chấm, hất, gập, móc)','Áp dụng 7 quy tắc bút thuận cho mọi chữ mới gặp','Vượt bài kiểm tra 10 câu về nét & bút thuận (100%)'];
EXTOUT.radical=()=>['Nhận ra 24 bộ thủ hay gặp nhất trong tiếng Trung công sở','Đoán được nghĩa của chữ lạ nhờ bộ thủ (thấy 贝 → tiền bạc, thấy 扌 → động tác tay)','Dùng âm Hán Việt làm cầu nối để nhớ chữ','Vượt bài kiểm tra bộ thủ + Hán Việt (100%)'];
EXTCONTENT.stroke=()=>{setTimeout(mountBasics,0);return writeBasicsHTML();};
EXTCONTENT.radical=()=>{setTimeout(mountRadicals,0);return writeRadicalHTML();};
ROADMAP2[0].steps.push({k:'s1f',t:'Nét cơ bản & 7 quy tắc bút thuận',d:'8 nét gốc của mọi chữ Hán + 7 quy tắc thứ tự viết, có video từng nét. Đây là nền để viết được BẤT KỲ chữ nào.',go:['write','basics'],tag:'Học'});
ROADMAP2[1].steps.push({k:'s2f',t:'Bộ thủ & âm Hán Việt — cách nhớ chữ của người Việt',d:'24 bộ thủ hay gặp nhất + cách dùng âm Hán Việt làm cầu nối. Học xong bạn đoán được nghĩa chữ chưa từng gặp.',go:['write','radical'],tag:'Học'});
ROADMAP2[2].steps.push({k:'s3g',t:'Luyện viết tay 15 chữ Hán',d:'Tự viết từng nét bằng chuột/ngón tay, app chấm đúng sai. Cần 15 chữ viết đúng hoàn toàn (không sai nét nào).',go:['write','practice'],auto:'write:15',tag:'Luyện'});
ROADMAP2[4].steps.push({k:'s5f',t:'Luyện viết tay đủ 30 chữ Hán',d:'Nâng tổng số chữ tự viết đúng lên 30 — đủ vốn để ghi chép tay cơ bản tại nơi làm việc.',go:['write','practice'],auto:'write:30',tag:'Luyện'});

/* trợ giúp */
HELP.splice(3,0,
 {v:'write',q:'Học viết chữ Hán trong app thế nào?',a:'Mục <b>Viết chữ Hán</b> có 4 phần: <b>Nét & quy tắc</b> (8 nét cơ bản + 7 quy tắc bút thuận, có video từng nét) → <b>Bộ thủ</b> (24 bộ hay gặp, giúp đoán nghĩa chữ lạ) → <b>Tra chữ</b> (tra bất kỳ chữ nào trong kho: nét viết, số nét, âm Hán Việt, từ chứa chữ đó) → <b>Luyện viết</b> (tự vẽ từng nét, app chấm đúng/sai). Trong thẻ từ vựng cũng có mục "Cách viết" — bấm từng chữ là xem được ngay.',go:['write']},
 {q:'Âm Hán Việt dùng để làm gì?',a:'Đây là lợi thế riêng của người Việt. 交货期 đọc Hán Việt là <b>GIAO HÓA KỲ</b> — nghe là đoán ra "kỳ hạn giao hàng" ngay, không cần học vẹt. App hiện âm Hán Việt cho tất cả 851 chữ trong kho từ; gặp chữ mới hãy đọc thầm âm Hán Việt trước khi tra nghĩa.'},
 {q:'Ô tập viết không hiện / không vẽ được?',a:'Phần nét viết dùng thư viện tải từ internet nên cần có mạng. Nếu mất mạng, app vẫn hiện quy tắc bút thuận, bộ thủ, âm Hán Việt và chữ mẫu cỡ lớn. Trên điện thoại hãy viết bằng <b>ngón tay</b> trực tiếp lên ô vuông; trên máy tính giữ chuột trái và kéo theo nét.'}
);
/* onboarding: thêm màn giới thiệu viết chữ */
OB.splice(3,0,{h:'书',t:'Và cả cách VIẾT từng chữ',b:'Mục <b>Viết chữ Hán</b> dạy 8 nét cơ bản, 7 quy tắc bút thuận, 24 bộ thủ, và cho bạn <b>tự viết từng nét bằng ngón tay</b> — app chấm đúng sai. Mỗi chữ đều có <b>âm Hán Việt</b>: lợi thế riêng của người Việt để nhớ chữ nhanh gấp nhiều lần.'});

/* ================= INIT ================= */
S.write=S.write||{ok:{},tries:{}};
S.visits++;save();
$('#xpFoot').textContent=S.xp+' XP';
buildHelp();
const _theme0=$('#themeBtn').onclick;
$('#themeBtn').onclick=()=>{_theme0();if(currentView==='write')RENDER.write($('#view-write'));};
show('dashboard');
if(!S.onboarded)setTimeout(showOnboarding,600);
</script>
