<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职场中文 · Chinese for Work</title>
<meta name="description" content="Học tiếng Trung chuyên ngành: Sản xuất · Văn phòng · Xuất nhập khẩu · Phiên dịch · Đàm phán">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23BE3A2F'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='serif'>职</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface2:#EFECE3; --surface3:#E9E5DA;
  --border:#E3DED2; --border2:#D3CCBC;
  --ink:#221E18; --ink2:#5C554A; --ink3:#8B8375;
  --accent:#B93A2B; --accent-soft:#F5E3DF; --accent-ink:#93291C; --on-accent:#FFFFFF;
  --mfg:#3D6B8E; --mfg-soft:#E2ECF3; --office:#2E7D6B; --office-soft:#DFF0EA;
  --trade:#A9761F; --trade-soft:#F5ECD8; --interp:#5D5490; --interp-soft:#E8E5F4;
  --nego:#B93A2B; --nego-soft:#F5E3DF; --core:#8B8375; --core-soft:#E9E5DA;
  --good:#2E7D46; --good-soft:#E1F0E4; --warn:#A9761F; --warn-soft:#F5ECD8; --bad:#B3352C; --bad-soft:#F5E3DF;
  --shadow:0 1px 2px rgba(33,29,24,.05),0 6px 24px -8px rgba(33,29,24,.10);
  --shadow-lg:0 4px 10px rgba(33,29,24,.06),0 24px 60px -16px rgba(33,29,24,.16);
  --r:14px; --r-sm:10px;
  --sans:'Inter','Noto Sans SC',system-ui,sans-serif;
  --zh-display:'Noto Serif SC','Noto Sans SC',serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#171310; --surface:#201C16; --surface2:#2A251E; --surface3:#332D24;
  --border:#352F26; --border2:#453D31;
  --ink:#EDE7DB; --ink2:#B0A794; --ink3:#7E7666;
  --accent:#D96A57; --accent-soft:#3C2018; --accent-ink:#E89383; --on-accent:#1D0F0B;
  --mfg:#7FA8C9; --mfg-soft:#1E2B37; --office:#6FB3A0; --office-soft:#1B2E28;
  --trade:#CDA254; --trade-soft:#32291A; --interp:#9C93CC; --interp-soft:#272338;
  --nego:#D96A57; --nego-soft:#3C2018; --core:#7E7666; --core-soft:#332D24;
  --good:#7CBF8E; --good-soft:#1C2E20; --warn:#CDA254; --warn-soft:#32291A; --bad:#DB7A6C; --bad-soft:#3C1F19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px -8px rgba(0,0,0,.45);
  --shadow-lg:0 4px 10px rgba(0,0,0,.35),0 24px 60px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
.zh{font-family:'Noto Sans SC',var(--sans)}
.zh-display{font-family:var(--zh-display);font-weight:900}
.pinyin{color:var(--ink3);font-size:.85em;letter-spacing:.02em}
.vi{color:var(--ink2)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;transition:transform .25s ease}
.main{flex:1;margin-left:248px;padding:28px 36px 80px;max-width:1240px}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.brand-mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--zh-display);font-size:22px;flex-shrink:0}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink2);margin-bottom:1px;text-align:left;transition:background .15s}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item.active svg{opacity:1}
.nav-zh{margin-left:auto;font-size:11px;color:var(--ink3);font-family:'Noto Sans SC',sans-serif}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3)}
.theme-btn{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center}
.theme-btn:hover{background:var(--surface2)}
.menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:60;width:42px;height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);place-items:center}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:45}
@media(max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .scrim.show{display:block}
  .main{margin-left:0;padding:70px 16px 80px}
}

/* ============ COMMON ============ */
.view{display:none;animation:fadein .25s ease}
.view.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:22px}
.page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.page-title .zh-display{color:var(--accent);margin-right:8px}
.page-sub{color:var(--ink2);margin-top:6px;max-width:640px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.dash-cols{grid-template-columns:1.4fr 1fr}
@media(max-width:1000px){.dash-cols{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--border2);background:var(--surface);transition:all .15s}
.btn:hover{border-color:var(--ink3)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-ghost{border-color:transparent;color:var(--ink2)}
.btn-ghost:hover{background:var(--surface2);border-color:transparent}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.chip-mfg{background:var(--mfg-soft);color:var(--mfg)}
.chip-office{background:var(--office-soft);color:var(--office)}
.chip-trade{background:var(--trade-soft);color:var(--trade)}
.chip-interp{background:var(--interp-soft);color:var(--interp)}
.chip-nego{background:var(--accent-soft);color:var(--accent-ink)}
.chip-core{background:var(--surface3);color:var(--ink2)}
.chip-good{background:var(--good-soft);color:var(--good)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:99px;background:currentColor}
.speak-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--ink2);flex-shrink:0;transition:all .15s}
.speak-btn:hover{color:var(--accent);border-color:var(--accent)}
.speak-btn.playing{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.section-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--border)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:36px;text-align:center;color:var(--ink3)}

/* ============ DASHBOARD ============ */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.hero-greet .zh-display{font-size:34px;color:var(--accent);display:block;line-height:1.2}
.hero-greet p{color:var(--ink2);margin-top:4px}
.rank-badge{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 18px;box-shadow:var(--shadow)}
.rank-badge .zh-display{font-size:26px;color:var(--accent)}
.rank-title{font-weight:700;font-size:14px}
.rank-sub{font-size:12px;color:var(--ink3)}
.stat{padding:16px 18px}
.stat-val{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--ink3);margin-top:2px}
.stat-zh{float:right;font-family:var(--zh-display);font-size:20px;opacity:.22}
.continue-card{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
.continue-icon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--zh-display);font-size:26px;flex-shrink:0}
.radar-wrap{display:flex;gap:8px;flex-direction:column;align-items:center;padding:18px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* ============ CAREER ============ */
.career-card{position:relative;overflow:hidden;padding:22px;cursor:pointer;transition:transform .18s,box-shadow .18s;border-top:3px solid transparent}
.career-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.career-hanzi{font-family:var(--zh-display);font-size:44px;line-height:1;position:absolute;right:14px;top:12px;opacity:.13}
.career-title{font-weight:800;font-size:16.5px;margin:8px 0 2px}
.career-zh{font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--ink2)}
.career-desc{font-size:13px;color:var(--ink2);margin-top:8px}
.module-chip{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--surface2);font-size:12px;margin:3px 3px 0 0;color:var(--ink2)}

/* ============ ROADMAP / SKILLTREE ============ */
.stage{display:flex;gap:16px;position:relative;padding-bottom:26px}
.stage::before{content:"";position:absolute;left:21px;top:46px;bottom:0;width:2px;background:var(--border2)}
.stage:last-child::before{display:none}
.stage-num{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border2);display:grid;place-items:center;font-weight:800;flex-shrink:0;z-index:1;font-variant-numeric:tabular-nums}
.stage.done .stage-num{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.stage.now .stage-num{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stage-body{flex:1;padding:10px 16px 14px}
.tree{overflow-x:auto;padding:10px 0}

/* ============ VOCAB ============ */
.vfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.vfilter{padding:7px 14px;border-radius:99px;border:1px solid var(--border2);font-size:12.5px;font-weight:600;color:var(--ink2)}
.vfilter.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vsearch{flex:1;min-width:180px;padding:9px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13.5px}
.vcard{padding:16px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.vcard .hanzi{font-family:'Noto Sans SC',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em}
.vcard .imp{position:absolute;top:14px;right:14px;display:flex;gap:2px}
.imp i{width:5px;height:5px;border-radius:99px;background:var(--border2)}
.imp i.on{background:var(--trade)}
.vmeta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.star-btn{color:var(--ink3)}
.star-btn.on{color:var(--trade)}

/* ============ MODAL ============ */
.modal-scrim{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:90;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal-scrim.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;padding:26px;position:relative;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.modal-close:hover{background:var(--surface2);color:var(--ink)}
.modal .big-hanzi{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:40px;line-height:1.2}
.mrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
.mrow b{width:110px;flex-shrink:0;color:var(--ink3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.rel-chip{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--surface2);font-size:13px;margin:2px 4px 2px 0;cursor:pointer;font-family:'Noto Sans SC',sans-serif}
.rel-chip:hover{background:var(--accent-soft);color:var(--accent-ink)}

/* ============ DIALOGUE ============ */
.dlg{display:flex;flex-direction:column;gap:10px}
.dlg-line{display:flex;gap:12px;align-items:flex-start}
.dlg-line .avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--zh-display);font-size:16px;flex-shrink:0;color:#fff}
.dlg-bubble{background:var(--surface2);border-radius:4px 14px 14px 14px;padding:10px 14px;max-width:640px}
.dlg-line.me{flex-direction:row-reverse}
.dlg-line.me .dlg-bubble{background:var(--accent-soft);border-radius:14px 4px 14px 14px}
.dlg-zh{font-family:'Noto Sans SC',sans-serif;font-size:16px;font-weight:500}
.dlg-pinyin{font-size:12px;color:var(--ink3);margin-top:2px}
.dlg-vi{font-size:12.5px;color:var(--ink2);margin-top:4px;padding-top:4px;border-top:1px dashed var(--border2)}
.dlg-speaker{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toggle{padding:5px 12px;border-radius:8px;border:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--ink2)}
.toggle.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ============ LESSON ============ */
.stepper{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 14px}
.step-pill{flex-shrink:0;padding:7px 13px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border2);color:var(--ink3);white-space:nowrap}
.step-pill.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.step-pill.now{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lesson-nav{display:flex;justify-content:space-between;margin-top:22px;gap:12px}
.expr-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.expr-item:first-child{border-top:none}

/* ============ QUIZ / MCQ ============ */
.mcq-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border2);margin-bottom:10px;transition:all .15s;background:var(--surface)}
.mcq-opt:hover{border-color:var(--ink3)}
.mcq-opt .key{width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.mcq-opt.correct{border-color:var(--good);background:var(--good-soft)}
.mcq-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mcq-opt:disabled{cursor:default}
.feedback{padding:13px 16px;border-radius:12px;font-size:13.5px;margin-top:6px}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}

/* ============ CHAT / ROLEPLAY ============ */
.chat-shell{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:480px}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.chat-input-zone{border-top:1px solid var(--border);padding:14px 18px;background:var(--surface)}
.choice-btn{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border2);margin-bottom:8px;transition:all .15s;background:var(--surface)}
.choice-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice-btn .zh{font-size:14.5px;font-weight:500}
.choice-btn .vi{display:block;font-size:12px;margin-top:2px}
.persona-card{padding:16px;text-align:center;cursor:pointer;transition:all .15s;border:1.5px solid var(--border)}
.persona-card:hover,.persona-card.sel{border-color:var(--accent);box-shadow:var(--shadow-lg)}
.persona-card .avatar{width:52px;height:52px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;font-family:var(--zh-display);font-size:24px;color:#fff}
.typing{display:inline-flex;gap:4px;padding:12px 16px}
.typing i{width:6px;height:6px;border-radius:99px;background:var(--ink3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ============ SCORE REPORT ============ */
.score-big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.score-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13.5px}
.score-row b{width:150px;flex-shrink:0;font-weight:600}
.score-row .bar{flex:1}
.score-row .num{width:36px;text-align:right;font-weight:700}

/* ============ INTERPRETER ============ */
.interp-card{max-width:680px;margin:0 auto;text-align:center;padding:34px 28px}
.interp-src{font-family:'Noto Sans SC',sans-serif;font-size:24px;font-weight:700;line-height:1.5;text-wrap:balance}
.interp-dir{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:16px}
.reveal-box{background:var(--surface2);border-radius:12px;padding:16px;margin-top:18px;text-align:left}

/* ============ MISSION ============ */
.mission-card{padding:20px;border-left:4px solid var(--accent)}
.mstep{display:flex;gap:12px;padding:10px 0;align-items:flex-start;border-top:1px dashed var(--border)}
.mstep-dot{width:26px;height:26px;border-radius:99px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.mstep.done .mstep-dot{background:var(--good-soft);color:var(--good)}
.mstep.now .mstep-dot{background:var(--accent);color:var(--on-accent)}

/* ============ DAY SIM ============ */
.timeline-slot{display:flex;gap:16px;padding-bottom:22px;position:relative}
.timeline-slot::before{content:"";position:absolute;left:29px;top:40px;bottom:0;width:2px;background:var(--border2)}
.timeline-slot:last-child::before{display:none}
.time-chip{width:60px;flex-shrink:0;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);padding-top:8px;text-align:right}
.slot-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;z-index:1;background:var(--surface);border:1px solid var(--border2)}
.timeline-slot.done .slot-icon{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.timeline-slot.now .slot-icon{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ============ SRS ============ */
.srs-card{max-width:520px;margin:0 auto;text-align:center;padding:40px 28px;cursor:pointer}
.srs-hanzi{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:52px}
.srs-btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* ============ GRAPH ============ */
.graph-wrap{overflow-x:auto}
.gnode{cursor:pointer}
.gnode rect{transition:all .15s}
.gnode:hover rect{filter:brightness(1.05);stroke-width:2.5}
.gedge{stroke:var(--border2);stroke-width:1.6;fill:none}
.gedge.flow{stroke:var(--accent);stroke-dasharray:5 4;opacity:.7}

/* ============ MISC ============ */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:100;opacity:0;transition:all .3s;box-shadow:var(--shadow-lg);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.xp-float{color:var(--good);font-weight:800}
table.simple{width:100%;border-collapse:collapse;font-size:13.5px}
table.simple th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--border2)}
table.simple td{padding:9px 10px;border-bottom:1px solid var(--border)}
</style>
</head>

 [0,'下周正好赶K105的订单，你的工作谁来接？','Xià zhōu zhènghǎo gǎn K105 de dìngdān, nǐ de gōngzuò shéi lái jiē?','Tuần sau đúng lúc chạy đơn K105, việc của cậu ai tiếp nhận?'],
 [1,'我已经跟小梅说好了，她帮我跟进报表。走之前我会把交接内容写清楚发到群里。','Wǒ yǐjīng gēn Xiǎo Méi shuō hǎo le, tā bāng wǒ gēnjìn bàobiǎo. Zǒu zhīqián wǒ huì bǎ jiāojiē nèiróng xiě qīngchu fā dào qún lǐ.','Tôi đã nói với Tiểu Mai rồi, cô ấy theo giúp báo biểu. Trước khi đi tôi sẽ viết rõ nội dung bàn giao gửi vào nhóm.'],
 [0,'行，那你把请假单填了，我签字。','Xíng, nà nǐ bǎ qǐngjiàdān tián le, wǒ qiānzì.','Được, vậy cậu điền đơn xin nghỉ đi, tôi ký.'],
 [1,'谢谢主管！','Xièxie zhǔguǎn!','Cảm ơn chủ quản ạ!']]},

{id:'d5',title:'Hỏi giá và MOQ với nhà cung cấp mới',zh:'询价与起订量',ind:'trade',level:'Workplace',diff:2,
 ctx:'Bạn là nhân viên thu mua, hỏi giá một nhà cung cấp Quảng Châu cho đơn hàng đầu tiên.',
 roles:['刘先生 · Nhà cung cấp','阿芳 · Thu mua VN'],goal:'Hỏi giá theo số lượng, MOQ, thời gian giao, điều kiện thanh toán, xin mẫu.',
 vocab:['t2','t3','t5','t10','t28','m29'],
 lines:[
 [1,'刘先生您好，我们对贵司的A30型号很感兴趣，想询一下价。','Liú xiānsheng nín hǎo, wǒmen duì guì sī de A30 xínghào hěn gǎn xìngqù, xiǎng xún yíxià jià.','Chào ông Lưu, chúng tôi rất quan tâm model A30 của quý công ty, muốn hỏi giá.'],
 [0,'您好您好！请问贵司大概要多少数量？','Nín hǎo nín hǎo! Qǐngwèn guì sī dàgài yào duōshǎo shùliàng?','Chào chị! Cho hỏi quý công ty cần số lượng khoảng bao nhiêu?'],
 [1,'第一单大概五千件。单价能做到多少？','Dì yī dān dàgài wǔqiān jiàn. Dānjià néng zuòdào duōshǎo?','Đơn đầu khoảng 5.000 chiếc. Đơn giá làm được bao nhiêu?'],
 [0,'五千件的话，单价是12块5，FOB广州。','Wǔqiān jiàn de huà, dānjià shì 12 kuài 5, FOB Guǎngzhōu.','5.000 chiếc thì đơn giá 12,5 tệ, FOB Quảng Châu.'],
 [1,'如果做到一万件呢？','Rúguǒ zuòdào yíwàn jiàn ne?','Nếu lên 10.000 chiếc thì sao?'],
 [0,'一万件可以给到11块8。我们的起订量是三千件。','Yíwàn jiàn kěyǐ gěi dào 11 kuài 8. Wǒmen de qǐdìngliàng shì sānqiān jiàn.','10.000 chiếc có thể để 11,8 tệ. MOQ của chúng tôi là 3.000 chiếc.'],
 [1,'明白。交货期多久？付款方式呢？','Míngbai. Jiāohuòqī duō jiǔ? Fùkuǎn fāngshì ne?','Hiểu rồi. Thời hạn giao bao lâu? Phương thức thanh toán thế nào?'],
 [0,'收到订金后25天出货。付款是30%订金，见提单副本付尾款。','Shōudào dìngjīn hòu 25 tiān chūhuò. Fùkuǎn shì 30% dìngjīn, jiàn tídān fùběn fù wěikuǎn.','Nhận cọc xong 25 ngày xuất hàng. Thanh toán cọc 30%, thấy bản sao vận đơn trả nốt.'],
 [1,'可以先寄两个样品给我们确认吗？样品费怎么算？','Kěyǐ xiān jì liǎng gè yàngpǐn gěi wǒmen quèrèn ma? Yàngpǐnfèi zěnme suàn?','Có thể gửi hai mẫu cho chúng tôi xác nhận trước không? Phí mẫu tính sao?'],
 [0,'样品免费，运费到付。下单后运费我们也退给您。','Yàngpǐn miǎnfèi, yùnfèi dàofù. Xiàdān hòu yùnfèi wǒmen yě tuì gěi nín.','Mẫu miễn phí, cước người nhận trả. Đặt hàng xong cước chúng tôi cũng hoàn lại chị.'],
 [1,'好的，麻烦您把报价单和产品目录发到我邮箱，我们确认样品后再谈。','Hǎo de, máfan nín bǎ bàojiàdān hé chǎnpǐn mùlù fā dào wǒ yóuxiāng, wǒmen quèrèn yàngpǐn hòu zài tán.','Vâng, phiền ông gửi bảng báo giá và catalogue vào email tôi, chúng tôi xác nhận mẫu xong bàn tiếp.']]},

{id:'d6',title:'Khách giục hàng — hàng kẹt thông quan',zh:'货物清关延误',ind:'trade',level:'Professional',diff:3,
 ctx:'Hàng kẹt ở hải quan 2 ngày vì thiếu C/O. Khách gọi điện giục gấp vì dây chuyền sắp thiếu liệu.',
 roles:['陈总 · Khách TQ','阿南 · NV XNK VN'],goal:'Trấn an khách, nói rõ nguyên nhân + thời gian dự kiến, đưa phương án dự phòng.',
 vocab:['t45','t47','t41','m50','t58','o29'],
 lines:[
 [0,'阿南，货到底什么时候能到？我们生产线后天就要停线了！','Ā Nán, huò dàodǐ shénme shíhou néng dào? Wǒmen shēngchǎnxiàn hòutiān jiù yào tíngxiàn le!','A Nam, rốt cuộc khi nào hàng đến? Dây chuyền chúng tôi ngày kia là dừng rồi!'],
 [1,'陈总，非常抱歉让您着急了。我先说明一下情况：货已经到港，卡在清关，原因是Form E上的一个信息和发票不一致。','Chén zǒng, fēicháng bàoqiàn ràng nín zháojí le. Wǒ xiān shuōmíng yíxià qíngkuàng: huò yǐjīng dào gǎng, kǎ zài qīngguān, yuányīn shì Form E shàng de yí gè xìnxī hé fāpiào bù yízhì.','Tổng Trần, thành thật xin lỗi đã để ngài sốt ruột. Tôi xin nói rõ tình hình: hàng đã đến cảng, kẹt ở thông quan, nguyên nhân là một thông tin trên form E không khớp với invoice.'],
 [0,'那要多久才能解决？','Nà yào duō jiǔ cái néng jiějué?','Vậy bao lâu mới giải quyết được?'],
 [1,'我们已经重新提交了资料，报关行说最晚明天下午放行。','Wǒmen yǐjīng chóngxīn tíjiāo le zīliào, bàoguānháng shuō zuì wǎn míngtiān xiàwǔ fàngxíng.','Chúng tôi đã nộp lại hồ sơ, đại lý hải quan nói muộn nhất chiều mai thả hàng.'],
 [0,'明天下午放行，到我们工厂也要后天晚上了，还是来不及！','Míngtiān xiàwǔ fàngxíng, dào wǒmen gōngchǎng yě yào hòutiān wǎnshang le, háishi láibují!','Chiều mai thả hàng, về đến nhà máy chúng tôi cũng phải tối ngày kia, vẫn không kịp!'],
 [1,'我们准备了一个应急方案：放行后改用两台卡车分批直送，第一批明天半夜就能到厂，先保证您的生产线不停。','Wǒmen zhǔnbèi le yí gè yìngjí fāng àn: fàngxíng hòu gǎi yòng liǎng tái kǎchē fēnpī zhí sòng, dì yī pī míngtiān bànyè jiù néng dào chǎng, xiān bǎozhèng nín de shēngchǎnxiàn bù tíng.','Chúng tôi đã chuẩn bị phương án khẩn cấp: thả hàng xong đổi sang hai xe tải chia đợt chở thẳng, đợt đầu nửa đêm mai đến nhà máy, trước hết bảo đảm dây chuyền của ngài không dừng.'],
 [0,'运费谁出？','Yùnfèi shéi chū?','Cước ai chịu?'],
 [1,'这次的额外运费由我们全部承担，这是我们的责任。','Zhè cì de éwài yùnfèi yóu wǒmen quánbù chéngdān, zhè shì wǒmen de zérèn.','Cước phát sinh lần này chúng tôi chịu toàn bộ, đây là trách nhiệm của chúng tôi.'],
 [0,'行吧。以后单证一定要提前检查好。','Xíng ba. Yǐhòu dānzhèng yídìng yào tíqián jiǎnchá hǎo.','Thôi được. Sau này chứng từ nhất định phải kiểm tra kỹ từ trước.'],
 [1,'一定。我们已经加了一道单证复核流程，以后不会再发生这种问题。有任何进展我随时向您汇报。','Yídìng. Wǒmen yǐjīng jiā le yí dào dānzhèng fùhé liúchéng, yǐhòu bú huì zài fāshēng zhè zhǒng wèntí. Yǒu rènhé jìnzhǎn wǒ suíshí xiàng nín huìbào.','Nhất định ạ. Chúng tôi đã thêm một bước rà soát chứng từ, sau này sẽ không xảy ra vấn đề này nữa. Có tiến triển gì tôi báo cáo ngài ngay.']]},

{id:'d7',title:'Phiên dịch cuộc họp QC giữa kỹ sư TQ và tổ trưởng VN',zh:'工厂会议翻译',ind:'interp',level:'Professional',diff:3,
 ctx:'Kỹ sư Trung Quốc trao đổi với tổ trưởng Việt Nam về lỗi hàn thiếc; bạn là phiên dịch, dịch hai chiều.',
 roles:['周工 · Kỹ sư TQ','翻译 · Bạn (dịch cho tổ trưởng Hà)'],goal:'Dịch chính xác thuật ngữ, xác nhận số liệu, giữ trung lập.',
 vocab:['i4','i6','i8','i14','m18','m45'],
 lines:[
 [0,'你跟何组长说，昨天的焊接不良率到了2%，比标准高了四倍。','Nǐ gēn Hé zǔzhǎng shuō, zuótiān de hànjiē bùliánglǜ dào le 2%, bǐ biāozhǔn gāo le sì bèi.','(Nói với tổ trưởng Hà) tỷ lệ lỗi hàn hôm qua lên 2%, cao gấp bốn lần tiêu chuẩn.'],
 [1,'（对何组长）周工说：昨天lỗi hàn thiếc lên 2%, cao gấp 4 lần tiêu chuẩn cho phép。','(duì Hé zǔzhǎng)','(Dịch cho tổ trưởng Hà bằng tiếng Việt, giữ nguyên con số.)'],
 [0,'问他，是不是换了新的焊锡材料？','Wèn tā, shì bu shì huàn le xīn de hánxī cáiliào?','Hỏi anh ấy, có phải đổi vật liệu thiếc hàn mới không?'],
 [1,'何组长确认：是的，周一开始用了新供应商的焊锡。','Hé zǔzhǎng quèrèn: shì de, zhōuyī kāishǐ yòng le xīn gōngyìngshāng de hánxī.','Tổ trưởng Hà xác nhận: đúng vậy, từ thứ Hai bắt đầu dùng thiếc hàn của nhà cung cấp mới.'],
 [0,'新材料的熔点不一样，烙铁温度要从350度调到365度。让他今天全线调整。','Xīn cáiliào de róngdiǎn bù yíyàng, làotiě wēndù yào cóng 350 dù tiáo dào 365 dù. Ràng tā jīntiān quánxiàn tiáozhěng.','Vật liệu mới điểm nóng chảy khác, nhiệt độ mỏ hàn phải chỉnh từ 350 lên 365 độ. Bảo anh ấy hôm nay chỉnh cả tuyến.'],
 [1,'跟您确认一下：是365度，对吗？','Gēn nín quèrèn yíxià: shì 365 dù, duì ma?','Tôi xác nhận lại với ngài: là 365 độ, đúng không ạ?'],
 [0,'对，365。另外不良品全部返工，今晚要重新检验。','Duì, 365. Lìngwài bùliángpǐn quánbù fǎngōng, jīnwǎn yào chóngxīn jiǎnyàn.','Đúng, 365. Ngoài ra hàng lỗi làm lại toàn bộ, tối nay phải kiểm nghiệm lại.'],
 [1,'何组长说人手不够，问能不能明天上午完成返工？','Hé zǔzhǎng shuō rénshǒu bú gòu, wèn néng bu néng míngtiān shàngwǔ wánchéng fǎngōng?','Tổ trưởng Hà nói thiếu người, hỏi có thể sáng mai hoàn thành làm lại được không?'],
 [0,'最晚明天中午。客户后天来验货。','Zuì wǎn míngtiān zhōngwǔ. Kèhù hòutiān lái yànhuò.','Muộn nhất trưa mai. Khách ngày kia đến kiểm hàng.'],
 [1,'好的，我转达：muộn nhất trưa mai phải xong, vì ngày kia khách đến kiểm hàng。','Hǎo de, wǒ zhuǎndá.','Vâng, tôi chuyển lời ngay.']]},

{id:'d8',title:'Gọi điện chăm sóc khách sau giao hàng',zh:'售后回访电话',ind:'trade',level:'Workplace',diff:2,
 ctx:'Bạn chủ động gọi cho khách Trung Quốc sau khi lô hàng đầu tiên đến nơi, hỏi phản hồi và gợi mở đơn tiếp theo.',
 roles:['吴经理 · Khách TQ','阿香 · Sales VN'],goal:'Hỏi thăm chất lượng, xử lý phản hồi nhỏ, mở đơn hàng mới.',
 vocab:['c28','t26','m16','c30','o40'],
 lines:[
 [1,'吴经理您好，我是越南VinaTech的阿香。第一批货上周到了吧？用得怎么样？','Wú jīnglǐ nín hǎo, wǒ shì Yuènán VinaTech de Ā Xiāng. Dì yī pī huò shàng zhōu dào le ba? Yòng de zěnmeyàng?','Chào giám đốc Ngô, tôi là A Hương của VinaTech Việt Nam. Lô đầu tuần trước đến rồi chứ ạ? Dùng thấy thế nào?'],
 [0,'到了到了。质量整体不错，就是有一箱外包装有点压坏了。','Dào le dào le. Zhìliàng zhěngtǐ búcuò, jiùshì yǒu yì xiāng wài bāozhuāng yǒudiǎn yā huài le.','Đến rồi. Chất lượng nhìn chung tốt, chỉ có một thùng bao bì ngoài hơi bị đè móp.'],
 [1,'不好意思！里面的产品有没有受影响？','Bù hǎoyìsi! Lǐmiàn de chǎnpǐn yǒu méiyǒu shòu yǐngxiǎng?','Xin lỗi ngài! Sản phẩm bên trong có bị ảnh hưởng không ạ?'],
 [0,'产品没事，就是不太好看。','Chǎnpǐn méishì, jiùshì bú tài hǎokàn.','Sản phẩm không sao, chỉ là không đẹp lắm.'],
 [1,'下一批我们会把外箱加厚，另外每托盘再加一层缠膜。','Xià yì pī wǒmen huì bǎ wàixiāng jiā hòu, lìngwài měi tuōpán zài jiā yì céng chánmó.','Lô sau chúng tôi sẽ tăng độ dày thùng ngoài, thêm một lớp màng quấn mỗi pallet.'],
 [0,'那就好。对了，十一月我们可能要追加一万件。','Nà jiù hǎo. Duì le, shíyī yuè wǒmen kěnéng yào zhuījiā yíwàn jiàn.','Vậy thì tốt. À, tháng 11 chúng tôi có thể đặt thêm 10.000 chiếc.'],
 [1,'太好了！十一月是旺季，建议您十月中之前下单，我们好提前排产。','Tài hǎo le! Shíyī yuè shì wàngjì, jiànyì nín shí yuè zhōng zhīqián xiàdān, wǒmen hǎo tíqián páichǎn.','Tốt quá ạ! Tháng 11 là mùa cao điểm, ngài nên đặt trước giữa tháng 10 để chúng tôi xếp lịch sản xuất sớm.'],
 [0,'行，我让采购跟你对接。','Xíng, wǒ ràng cǎigòu gēn nǐ duìjiē.','Được, tôi bảo bộ phận thu mua làm việc với cô.'],
 [1,'谢谢吴经理，保持联系！','Xièxie Wú jīnglǐ, bǎochí liánxì!','Cảm ơn giám đốc Ngô, giữ liên lạc ạ!']]}
];

<script>

{id:'sc2',ind:'mfg',title:'QC phát hiện tỷ lệ lỗi cao',zh:'质量问题',

   ['先不说，可能只是抽到的那几件有问题。','Tạm chưa nói, có khi chỉ mấy chiếc bốc trúng bị thôi.',0,'Che giấu vấn đề chất lượng là lỗi nặng nhất của QC.'],
   ['马上报告质量主管：K88抽检色差不良率4%，超标，建议暂停出货，扩大抽检。','Báo ngay chủ quản chất lượng: K88 kiểm xác suất lệch màu 4%, vượt chuẩn, đề nghị tạm dừng xuất hàng, mở rộng kiểm tra.',2,'Chuẩn quy trình QC: số liệu + đề xuất hành động.'],
   ['直接告诉车间重做。','Bảo thẳng xưởng làm lại.',1,'QC không tự quyết định làm lại cả lô — cần chủ quản xác nhận.']]},
  {prompt:'Chủ quản hỏi nguyên nhân. Kiểm tra cho thấy lô này dùng nguyên liệu của nhà cung cấp mới. Bạn nói:',opts:[
   ['应该是新供应商的材料有问题，跟我们没关系。','Chắc do vật liệu nhà cung cấp mới, không liên quan chúng ta.',1,'Đoán đúng hướng nhưng thiếu chuyên nghiệp — cần số liệu đối chứng.'],

{id:'sc3',ind:'office',title:'Sếp đổi lịch họp phút chót',zh:'会议改期',

  {prompt:'Khách đồng ý họp trước với bạn. Sau họp, bạn nhắn sếp:',opts:[

 situation:'Khách Trung Quốc yêu cầu giảm giá 8% cho đơn 10.000 chiếc. Bạn chỉ được phép giảm tối đa 3%.',
 objectives:['Giữ giá trong quyền hạn (≤3%)','Giải thích giá trị thay vì chỉ nói không','Đổi nhượng bộ lấy điều kiện (số lượng / thanh toán / đơn dài hạn)','Giữ quan hệ hợp tác'],
 hidden:'Khách sẽ dọa chuyển nhà cung cấp và bất ngờ đòi thêm công nợ 60 ngày.',
 vocabReq:['降价','底价','让步','长期合作','账期','成交'],
 start:'a',nodes:{
 a:{ai:['小阮，你们的报价我看过了。别的不说，价格必须降8个点，不然这单没法谈。','Xiǎo Ruǎn, nǐmen de bàojià wǒ kàn guò le. Bié de bù shuō, jiàgé bìxū jiàng 8 gè diǎn, bùrán zhè dān méi fǎ tán.','Tiểu Nguyễn, báo giá của các bạn tôi xem rồi. Khỏi nói nhiều, giá phải giảm 8%, không thì đơn này khỏi bàn.'],
  opts:[
  {zh:'陈总，8个点实在太多了。我们的成本您也清楚，原材料今年涨了两次。',vi:'Tổng Trần, 8% thật sự nhiều quá. Chi phí của chúng tôi ngài cũng rõ, nguyên liệu năm nay tăng hai lần.',s:2,next:'b'},
  {zh:'好的好的，8个点就8个点。',vi:'Vâng vâng, 8% thì 8%.',s:0,next:'z_lose',fb:'Vượt quyền hạn (tối đa 3%) và mất toàn bộ dư địa đàm phán ngay câu đầu.'},
  {zh:'不可能！这个价格已经很低了。',vi:'Không thể nào! Giá này thấp lắm rồi.',s:1,next:'b',fb:'Giữ giá nhưng cách nói quá cứng — thiếu 缓冲 (đệm) khiến không khí căng ngay.'}]},
 b:{ai:['成本谁家没有压力？说实话，广东有个厂给我们的价格比你们低10%。','Chéngběn shéi jiā méiyǒu yālì? Shuō shíhuà, Guǎngdōng yǒu gè chǎng gěi wǒmen de jiàgé bǐ nǐmen dī 10%.','Chi phí thì nhà nào chẳng áp lực? Nói thật, có xưởng ở Quảng Đông báo giá thấp hơn các bạn 10%.'],
  opts:[
  {zh:'价格低不代表质量一样。我们连续两年不良率控制在0.5%以下，这能帮贵司省下多少售后成本，您比我更清楚。',vi:'Giá thấp không có nghĩa chất lượng như nhau. Hai năm liền tỷ lệ lỗi chúng tôi dưới 0,5% — tiết kiệm cho quý công ty bao nhiêu chi phí hậu mãi, ngài rõ hơn tôi.',s:2,next:'c'},
  {zh:'那您去广东买吧。',vi:'Vậy ngài đi Quảng Đông mà mua.',s:0,next:'z_lose',fb:'Thách thức khách là tự đóng cửa đàm phán.'},
  {zh:'那我们最多降3个点，不能再多了。',vi:'Vậy chúng tôi giảm tối đa 3%, không hơn được nữa.',s:1,next:'d',fb:'Lộ mức trần quá sớm — bạn không còn gì để "nhường" ở các vòng sau.'}]},
 c:{ai:['质量好是应该的，这不是理由。这样，你降5个点，我马上签合同。','Zhìliàng hǎo shì yīnggāi de, zhè búshì lǐyóu. Zhèyàng, nǐ jiàng 5 gè diǎn, wǒ mǎshàng qiān hétong.','Chất lượng tốt là đương nhiên, không phải lý do. Thế này, cậu giảm 5%, tôi ký hợp đồng ngay.'],
  opts:[
  {zh:'5个点我们真的做不到。这样吧：如果贵司能把数量提到两万件，我可以向公司申请降3个点。',vi:'5% chúng tôi thật sự không làm được. Thế này: nếu quý công ty tăng số lượng lên 20.000 chiếc, tôi có thể xin công ty giảm 3%.',s:2,next:'e'},
  {zh:'4个点行不行？','vi':'4% được không?',s:0,next:'z_lose2',fb:'Mặc cả kiểu chẻ đôi vượt quyền hạn của bạn (max 3%) — sẽ kẹt khi khách đồng ý.'},
  {zh:'我要请示一下领导才能答复您。',vi:'Tôi phải xin ý kiến lãnh đạo mới trả lời ngài được.',s:1,next:'e',fb:'Hoãn binh hợp lệ nhưng bỏ lỡ cơ hội đổi số lượng lấy giá — người đàm phán giỏi luôn đề xuất trao đổi.'}]},
 d:{ai:['3个点太少了。你不给5个点，我们只能考虑别家。','3 gè diǎn tài shǎo le. Nǐ bù gěi 5 gè diǎn, wǒmen zhǐ néng kǎolǜ bié jiā.','3% ít quá. Không cho 5%, chúng tôi đành cân nhắc nhà khác.'],
  opts:[
  {zh:'陈总，光降价我们真的没有空间了。但如果数量提到两万件、或者签年度合同，条件都可以更好。',vi:'Tổng Trần, chỉ giảm giá thì chúng tôi hết dư địa thật rồi. Nhưng nếu tăng lên 20.000 chiếc, hoặc ký hợp đồng năm, điều kiện đều có thể tốt hơn.',s:2,next:'e'},
  {zh:'……那好吧，5个点。',vi:'…Thôi được, 5%.',s:0,next:'z_lose',fb:'Sụp đổ trước áp lực — vượt quyền và mất uy tín nội bộ.'},
  {zh:'我们已经是最低价了，您考虑一下吧。',vi:'Chúng tôi đã là giá thấp nhất, ngài cân nhắc đi.',s:1,next:'e',fb:'Giữ được giá nhưng bị động — không mở hướng cho khách gật đầu.'}]},
 e:{ai:['两万件……可以考虑。但还有一个条件：账期60天，不然免谈。','Liǎng wàn jiàn... kěyǐ kǎolǜ. Dàn hái yǒu yí gè tiáojiàn: zhàngqī 60 tiān, bùrán miǎn tán.','20.000 chiếc… có thể cân nhắc. Nhưng còn một điều kiện: công nợ 60 ngày, không thì khỏi bàn.'],
  opts:[
  {zh:'60天风险太大。我们退一步：前两单30%订金；从第三单开始给贵司30天账期。长期合作，互相信任要一步一步来。',vi:'60 ngày rủi ro quá lớn. Chúng ta lùi một bước: hai đơn đầu cọc 30%; từ đơn thứ ba cho quý công ty công nợ 30 ngày. Hợp tác lâu dài, tin nhau phải từng bước.',s:2,next:'f'},
  {zh:'账期的事我做不了主……',vi:'Việc công nợ tôi không quyết được…',s:1,next:'f',fb:'Trung thực nhưng yếu — nên kèm phương án trong quyền hạn (cọc/tiến độ) để giữ nhịp.'},
  {zh:'行，60天就60天。',vi:'Được, 60 ngày thì 60 ngày.',s:0,next:'z_lose2',fb:'Khách mới + công nợ 60 ngày = rủi ro công nợ nghiêm trọng. Không bao giờ gật ngay điều khoản thanh toán.'}]},
 f:{ai:['你这个人做生意还挺稳。好，两万件，降3个点，前两单付订金，第三单开始30天账期。就这么定了？','Nǐ zhège rén zuò shēngyì hái tǐng wěn. Hǎo, liǎng wàn jiàn, jiàng 3 gè diǎn, qián liǎng dān fù dìngjīn, dì sān dān kāishǐ 30 tiān zhàngqī. Jiù zhème dìng le?','Cậu làm ăn khá chắc tay đấy. Được: 20.000 chiếc, giảm 3%, hai đơn đầu trả cọc, từ đơn ba công nợ 30 ngày. Chốt vậy nhé?'],
  opts:[
  {zh:'成交！我今天把合同和付款条款整理好发您邮箱，明天电话跟您再确认一次。谢谢陈总，合作愉快！',vi:'Chốt! Hôm nay tôi soạn hợp đồng và điều khoản thanh toán gửi email ngài, mai gọi xác nhận lại lần nữa. Cảm ơn Tổng Trần, hợp tác vui vẻ!',s:2,next:'z_win'},
  {zh:'嗯，可以。',vi:'Ừm, được.',s:1,next:'z_win',fb:'Chốt được nhưng thiếu bước xác nhận bằng văn bản — thói quen chuyên nghiệp quan trọng.'}]},
 z_win:{end:true,ai:['（谈判结束）','','Đàm phán kết thúc — bạn đạt thỏa thuận trong quyền hạn.']},
 z_lose:{end:true,lose:true,ai:['（谈判结束）','','Kết thúc: bạn đã nhượng bộ vượt quyền hạn hoặc làm đổ vỡ quan hệ.']},
 z_lose2:{end:true,lose:true,ai:['（谈判结束）','','Kết thúc: điều khoản đạt được gây rủi ro lớn cho công ty bạn.']}}},

{id:'rp2',char:'customer',title:'Giao trễ 4 ngày — giữ khách, né phạt',zh:'交期延误道歉与协商',diff:3,
 yourRole:'Nhân viên XNK Việt Nam',aiRole:'中国客户 · Giám đốc Ngô — đang rất bực',
 situation:'Lô hàng 15.000 chiếc sẽ trễ 4 ngày do bão làm chậm tàu. Bạn gọi điện chủ động báo trước.',
 objectives:['Chủ động báo tin xấu + xin lỗi chuyên nghiệp','Giải thích nguyên nhân khách quan không né trách nhiệm','Đưa phương án cụ thể','Tránh bồi thường 10% — tối đa chấp nhận 2% hoặc miễn cước đơn sau'],
 hidden:'Khách sẽ bất ngờ đòi bồi thường 10% giá trị đơn.',
 vocabReq:['延迟','道歉','方案','赔偿','分批交货','违约金'],
 start:'a',nodes:{
 a:{ai:['喂，小杜啊，有什么事？','Wéi, Xiǎo Dù a, yǒu shénme shì?','Alô, Tiểu Đỗ à, có việc gì thế?'],
  opts:[
  {zh:'吴经理，很抱歉打扰您。有个重要情况必须马上向您汇报：因为台风，船期推迟了，这批货预计要晚到4天。',vi:'GĐ Ngô, xin lỗi làm phiền ngài. Có tình huống quan trọng phải báo ngay: do bão, lịch tàu bị lùi, lô hàng dự kiến đến trễ 4 ngày.',s:2,next:'b'},
  {zh:'那个……货可能会稍微晚一点点到……','vi':'Ừm… hàng có thể đến muộn một chút xíu…',s:1,next:'b',fb:'Nói giảm "một chút xíu" với 4 ngày — khi khách biết sự thật sẽ mất niềm tin gấp đôi.'},
  {zh:'台风来了，货晚了，这个没办法，天灾嘛。',vi:'Bão đến, hàng trễ, chịu thôi, thiên tai mà.',s:0,next:'b',fb:'Dù là thiên tai, mở đầu kiểu phủi trách nhiệm khiến khách nổi nóng ngay.'}]},
 b:{ai:['什么？晚4天？我们月底就要上市促销，你知道每天的损失有多大吗？','Shénme? Wǎn 4 tiān? Wǒmen yuèdǐ jiù yào shàngshì cùxiāo, nǐ zhīdào měitiān de sǔnshī yǒu duō dà ma?','Cái gì? Trễ 4 ngày? Cuối tháng chúng tôi chạy khuyến mãi rồi, cậu biết mỗi ngày thiệt hại bao nhiêu không?'],
  opts:[
  {zh:'我完全理解，所以我们准备了应急方案：先空运3000件，保证您促销前三天到货，空运差价我们承担。','vi':'Tôi hoàn toàn hiểu, nên chúng tôi đã chuẩn bị phương án khẩn: gửi trước 3.000 chiếc bằng hàng không, bảo đảm đến trước khuyến mãi ba ngày, chênh lệch cước chúng tôi chịu.',s:2,next:'c'},
  {zh:'对不起，真的对不起……','vi':'Xin lỗi, thật sự xin lỗi…',s:1,next:'c',fb:'Xin lỗi suông không có 方案 — khách Trung Quốc cần phương án, không cần thêm lời xin lỗi.'},
  {zh:'损失也不能全怪我们吧，台风谁也控制不了。',vi:'Thiệt hại đâu thể trách hết chúng tôi, bão thì ai kiểm soát được.',s:0,next:'c',fb:'Cãi lý đúng lúc khách đang nóng = đổ dầu vào lửa.'}]},
 c:{ai:['3000件哪够！我不管你们怎么运，反正这次你们要赔偿订单金额的10%。','3000 jiàn nǎ gòu! Wǒ bùguǎn nǐmen zěnme yùn, fǎnzhèng zhè cì nǐmen yào péicháng dìngdān jīn é de 10%.','3.000 chiếc sao đủ! Tôi không cần biết các cậu vận chuyển kiểu gì, lần này các cậu phải bồi thường 10% giá trị đơn.'],
  opts:[
  {zh:'吴经理，10%超出了实际损失。合同里不可抗力条款也写明了台风属于免责范围。但我们重视合作：空运加到5000件，另外这单给您2%作为补偿，您看怎么样？',vi:'GĐ Ngô, 10% vượt thiệt hại thực tế. Điều khoản bất khả kháng trong hợp đồng cũng ghi rõ bão thuộc phạm vi miễn trách. Nhưng chúng tôi coi trọng hợp tác: tăng hàng không lên 5.000 chiếc, thêm 2% bồi thường cho đơn này, ngài thấy sao?',s:2,next:'d'},
  {zh:'10%太多了，5%行不行？',vi:'10% nhiều quá, 5% được không?',s:0,next:'d',fb:'Mặc cả trên con số khách hét mà không viện dẫn hợp đồng/thiệt hại thực — tự đưa mình vào thế yếu, 5% vẫn quá cao.'},
  {zh:'赔偿的事我回去问问领导。',vi:'Việc bồi thường tôi về hỏi lãnh đạo.',s:1,next:'d',fb:'Hoãn được nhưng nên nêu ngay căn cứ bất khả kháng để hạ mỏ neo 10% trước đã.'}]},
 d:{ai:['合同归合同，生意归生意。你们就给2%？我们的促销广告费都打出去了！','Hétong guī hétong, shēngyì guī shēngyì. Nǐmen jiù gěi 2%? Wǒmen de cùxiāo guǎnggàofèi dōu dǎ chūqù le!','Hợp đồng là hợp đồng, làm ăn là làm ăn. Các cậu đưa mỗi 2%? Tiền quảng cáo khuyến mãi chúng tôi chi ra hết rồi!'],
  opts:[
  {zh:'这样吧：2%补偿保持不变，另外下一个订单我们免海运费，再送贵司500件备品。促销要紧，我们把空运的5000件排最早的航班。',vi:'Thế này: giữ 2% bồi thường, thêm miễn cước biển đơn sau, tặng quý công ty 500 chiếc hàng dự phòng. Khuyến mãi là việc gấp, 5.000 chiếc hàng không chúng tôi xếp chuyến bay sớm nhất.',s:2,next:'e'},
  {zh:'那……3%，不能再多了。',vi:'Vậy… 3%, không hơn được nữa.',s:1,next:'e',fb:'Chấp nhận được nhưng tăng tiền mặt trực tiếp; gói "miễn cước + hàng tặng" khôn hơn vì chi phí thực thấp mà giá trị cảm nhận cao.'},
  {zh:'广告费和我们没关系。',vi:'Tiền quảng cáo không liên quan chúng tôi.',s:0,next:'e',fb:'Đúng lý nhưng sai thời điểm — khách cần thấy bạn chia sẻ trước khi chốt con số.'}]},
 e:{ai:['……行吧。空运5000件、2%补偿、下单免海运费。你今天下班前把方案写成邮件发我。','Xíng ba. Kōngyùn 5000 jiàn, 2% bǔcháng, xià dān miǎn hǎiyùnfèi. Nǐ jīntiān xiàbān qián bǎ fāng àn xiě chéng yóujiàn fā wǒ.','…Thôi được. Hàng không 5.000 chiếc, bồi thường 2%, đơn sau miễn cước biển. Trước giờ tan làm hôm nay gửi phương án bằng email cho tôi.'],
  opts:[
  {zh:'好的，一小时内发到您邮箱，抄送贵司采购部。这次给您添麻烦了，我们以后会提前一周跟踪船期，避免再发生这种情况。',vi:'Vâng, trong một tiếng gửi vào email ngài, CC phòng thu mua quý công ty. Lần này làm phiền ngài rồi; sau này chúng tôi sẽ theo dõi lịch tàu trước một tuần để không tái diễn.',s:2,next:'z_win'},
  {zh:'好的，就这样。',vi:'Vâng, vậy nhé.',s:1,next:'z_win',fb:'Chốt ổn nhưng thiếu cam kết phòng ngừa — câu 预防措施 giúp giữ khách lâu dài.'}]},
 z_win:{end:true,ai:['（通话结束）','','Cuộc gọi kết thúc.']}}},

{id:'rp3',char:'supervisor',title:'Báo cáo sự cố chất lượng cho chủ quản',zh:'向主管汇报质量问题',diff:2,
 yourRole:'Nhân viên QC Việt Nam',aiRole:'工厂主管 · Chủ quản Lưu — nói nhanh, ghét vòng vo',
 situation:'Kiểm xác suất phát hiện lô K88 có 4% lệch màu (chuẩn 1%). 16h chiều lô này phải xuất. Bây giờ là 10h sáng.',
 objectives:['Báo cáo ngắn gọn đủ dữ liệu','Đề xuất hành động rõ','Trả lời phản biện bằng số liệu','Chốt phương án khả thi trước 16h'],
 hidden:'Chủ quản sẽ ép xuất hàng đúng giờ bằng mọi giá.',
 vocabReq:['抽检','不良率','色差','返工','全检','暂停出货'],
 start:'a',nodes:{
 a:{ai:['小何，什么事？快说，我十点半还要开会。','Xiǎo Hé, shénme shì? Kuài shuō, wǒ shí diǎn bàn hái yào kāihuì.','Tiểu Hà, việc gì? Nói nhanh, 10 rưỡi tôi còn phải họp.'],
  opts:[
  {zh:'刘主管，K88抽检发现色差不良率4%，超标四倍。建议暂停出货，马上扩大抽检。','vi':'Chủ quản Lưu, K88 kiểm xác suất phát hiện lệch màu 4%, vượt chuẩn bốn lần. Đề nghị tạm dừng xuất hàng, mở rộng kiểm tra ngay.',s:2,next:'b'},

  opts:[['关于K90订单客户投诉的初步调查报告：客户反馈不良1000件，我司留样全检结果为划痕不良约8%，集中于12号夜班，原因初步判断为传送带垫片磨损。','Báo cáo điều tra sơ bộ khiếu nại đơn K90: khách phản ánh 1.000 lỗi; kiểm 100% hàng lưu mẫu cho thấy lỗi xước ~8%, tập trung ca đêm ngày 12, nguyên nhân sơ bộ là đệm băng tải mòn.',2,'Đủ: sự việc, số liệu đối chứng, phạm vi, nguyên nhân sơ bộ.'],['客户很生气，我们的货有问题，大家要重视。','Khách rất giận, hàng chúng ta có vấn đề, mọi người cần chú trọng.',0,'Cảm tính, không có dữ liệu.'],['12号夜班出了1000件不良品。','Ca đêm ngày 12 làm ra 1.000 hàng lỗi.',1,'Vội khẳng định đúng con số khách nêu dù kiểm tra nội bộ cho tỷ lệ khác.']]},
 {dept:'trade',title:'Gọi điện cho khách',type:'mcq',
  q:'Mở đầu cuộc gọi với khách đang bực:',
  opts:[['王经理您好。关于您反馈的不良品问题，我们已经完成内部核查，想向您同步结果，并商量处理方案，您现在方便吗？','Chào GĐ Vương. Về vấn đề hàng lỗi ngài phản ánh, chúng tôi đã hoàn tất kiểm tra nội bộ, muốn cập nhật kết quả và bàn phương án xử lý, giờ ngài tiện không ạ?',2,'Chủ động, có kết quả trong tay, tôn trọng thời gian khách.'],['王经理，那批货真的有1000件不良吗？','GĐ Vương, lô đó thật sự có 1.000 lỗi à?',0,'Mở đầu bằng nghi ngờ khách — châm ngòi xung đột.'],['王经理，不好意思不好意思，都是我们的错！','GĐ Vương, xin lỗi xin lỗi, đều là lỗi chúng tôi!',1,'Nhận hết lỗi trước khi thống nhất số liệu — mất thế đàm phán.']]},
 {dept:'mfg',title:'Giải thích nguyên nhân',type:'mcq',

  opts:[['经核查，是12号夜班传送带垫片磨损导致部分产品划伤。我们已更换垫片并增加每两小时巡检，这类问题不会再发生。','Qua kiểm tra, đệm băng tải ca đêm ngày 12 bị mòn làm xước một phần sản phẩm. Chúng tôi đã thay đệm và thêm tuần kiểm mỗi hai giờ; vấn đề này sẽ không tái diễn.',2,'Nguyên nhân cụ thể + đã khắc phục + phòng ngừa.'],['可能是运输过程中碰的吧。','Chắc va chạm trong lúc vận chuyển thôi.',0,'Đoán mò đổ cho vận chuyển khi đã có kết quả kiểm tra — nếu bị lật tẩy sẽ mất sạch uy tín.'],['机器的问题，跟人没关系。','Lỗi máy móc, không liên quan con người.',1,'Nửa vời — khách cần biết bạn đã làm gì để không tái diễn.']]},
 {dept:'nego',title:'Thương lượng phương án xử lý',type:'mcq',
  q:'Khách đòi trả lại toàn bộ 12.000 chiếc. Đối đáp tốt nhất:',

 {dept:'trade',title:'Chốt lịch giao bù',type:'interp',

 {dept:'office',title:'Email xác nhận',type:'mcq',
  q:'Chọn email xác nhận chuẩn nhất gửi khách sau cuộc gọi:',

 {dept:'office',title:'Rút kinh nghiệm nội bộ',type:'mcq',
  q:'Trong họp rút kinh nghiệm, sếp hỏi làm sao tránh tái diễn. Đề xuất tốt nhất:',
  opts:[['三条措施：设备垫片列入每周点检表；夜班增加一次首件检验；出货前抽检比例从3%提到5%，一个月后评估效果。','Ba biện pháp: đệm thiết bị đưa vào bảng kiểm tra tuần; ca đêm thêm một lần kiểm hàng đầu chuyền; tỷ lệ kiểm xác suất trước xuất tăng 3% lên 5%, một tháng sau đánh giá hiệu quả.',2,'Biện pháp cụ thể, đo được, có mốc đánh giá.'],['大家以后小心一点。','Mọi người sau này cẩn thận hơn.',0,'Khẩu hiệu, không phải biện pháp.'],['多骂骂夜班就好了。','Mắng ca đêm nhiều vào là được.',0,'Văn hóa đổ lỗi khiến lần sau không ai dám báo cáo sớm.']]}]},

 {dept:'trade',title:'Trả giá điều kiện với khách',type:'mcq',

<script>
/* ================= STATE ================= */
const DEF = {xp:0,skills:{chinese:8,mfg:0,office:0,trade:0,interp:0,nego:0},saved:{},done:{lesson:{},mission:{},scen:{},rp:{},day:{}},speak:0,visits:0};
let S;
try{S = Object.assign({},DEF,JSON.parse(localStorage.getItem('zwzn')||'{}'));
    S.skills=Object.assign({},DEF.skills,S.skills); S.done=Object.assign({},DEF.done,S.done);}
catch(e){S = JSON.parse(JSON.stringify(DEF));}
function save(){try{localStorage.setItem('zwzn',JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const VMAP={}; V.forEach(w=>VMAP[w.id]=w);
const DMAP={}; DIALOGUES.forEach(d=>DMAP[d.id]=d);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function rank(){let r=META.ranks[0];META.ranks.forEach(x=>{if(S.xp>=x[0])r=x});return r}
function nextRank(){return META.ranks.find(x=>x[0]>S.xp)}
function addXP(n,skill){S.xp+=n;
 if(skill&&S.skills[skill]!=null)S.skills[skill]=Math.min(100,+(S.skills[skill]+n*0.4).toFixed(1));
 S.skills.chinese=Math.min(100,+(S.skills.chinese+n*0.12).toFixed(1));
 save();$('#xpFoot').textContent=S.xp+' XP';toast('+'+n+' XP');}
function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

/* ================= TTS ================= */
let zhVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate,btn){
 if(!('speechSynthesis' in window)){toast('Trình duyệt không hỗ trợ đọc tiếng Trung');return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=rate||0.92;
 if(btn){btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}
 speechSynthesis.speak(u);S.speak++;save();}catch(e){}}
window.SPK=(el,text,rate)=>{
 if(el&&el.classList.contains('playing')){try{speechSynthesis.cancel()}catch(e){}el.classList.remove('playing');window._seqStop=true;return;}
 speak(text,rate,el);};
function itemsCount(){
 let n=V.length+V.reduce((a,w)=>a+(w.co?w.co.length:0),0)+SENTENCES.length+PHRASES.length;
 try{n+=NEGO.reduce((a,x)=>a+x.expr.length+x.mini.lines.length,0)+LESSONS.reduce((a,l)=>a+l.expr.length,0)+INTERP.reduce((a,s)=>a+s.items.length,0)+LEVELED.length*3+DIALOGUES.reduce((a,d)=>a+d.lines.length,0);}catch(e){}
 return n}
const spkBtn=(zh,rate)=>`<button class="speak-btn" onclick="SPK(this,'${esc(zh).replace(/'/g,"\\'")}',${rate||0.92})" title="Nghe">▸</button>`;
const spkBtns=zh=>`<span style="display:inline-flex;gap:6px">${spkBtn(zh)}<button class="speak-btn" style="font-size:9px" onclick="SPK(this,'${esc(zh).replace(/'/g,"\\'")}',0.6)" title="Chậm 0.6x">0.6x</button></span>`;

/* ================= NAV ================= */
let currentView='dashboard';
const RENDER={};
function show(view,param){
 try{speechSynthesis.cancel()}catch(e){}
 window._seqStop=true;
 currentView=view;
 $$('.view').forEach(v=>v.classList.remove('active'));
 const el=$('#view-'+view); if(!el)return;
 el.classList.add('active');
 $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
 if(RENDER[view])RENDER[view](el,param);
 $('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');
 window.scrollTo({top:0});
}
window.GO=show;
$('#nav').addEventListener('click',e=>{const b=e.target.closest('.nav-item');if(b)show(b.dataset.view);});
$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('show');};
$('#scrim').onclick=()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');};

/* theme */
function setTheme(t){if(t==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('zwzn_theme',t)}catch(e){}}
let _th='light';try{_th=localStorage.getItem('zwzn_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
setTheme(_th);
$('#themeBtn').onclick=()=>{_th=_th==='dark'?'light':'dark';setTheme(_th);};

/* ================= SHARED PIECES ================= */
function pageHead(eyebrow,zh,title,sub){return `<div class="page-head"><div class="page-eyebrow">${eyebrow}</div><h1 class="page-title"><span class="zh-display">${zh}</span>${title}</h1>${sub?`<p class="page-sub">${sub}</p>`:''}</div>`}
function chip(ind){const m=META.inds[ind];return `<span class="chip ${m.chip}"><span class="dot"></span>${m.name}</span>`}
function lvBadge(lv){const l=META.levels[lv];const cl=lv===1?'chip-good':lv===2?'chip-trade':'chip-nego';return `<span class="chip ${cl}" title="${l[1]}">L${lv} ${l[0]}</span>`}
function impDots(lv){return `<span class="imp">${[1,2,3].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</span>`}

function radarSVG(size){
 const dims=[['中文','chinese'],['制造','mfg'],['办公','office'],['进出口','trade'],['翻译','interp'],['谈判','nego']];
 const cx=size/2,cy=size/2,R=size/2-34;
 const pt=(i,r)=>{const a=Math.PI*2*i/6-Math.PI/2;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let grid='';[.33,.66,1].forEach(f=>{grid+='<polygon points="'+dims.map((d,i)=>pt(i,R*f).join(',')).join(' ')+'" fill="none" stroke="var(--border2)" stroke-width="1"/>'});
 let axes=dims.map((d,i)=>{const[x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border2)" stroke-width="1"/>`}).join('');
 const poly=dims.map((d,i)=>pt(i,R*Math.max(.04,(S.skills[d[1]]||0)/100)).join(',')).join(' ');

 if(w.ant&&w.ant.length)rows.push(['Trái nghĩa',w.ant.map(s=>`<span class="rel-chip">${esc(s)}</span>`).join('')]);

  ${rows.map(r=>`<div class="mrow"><b>${r[0]}</b><div style="flex:1">${r[1]}</div></div>`).join('')}`;
 $('#modalScrim').classList.add('show');

function renderModule(el,k){

 let body='';
 if(tab==='vocab'){
  body=groups.map(g=>{
   const gw=words.filter(w=>w.g===g[0]);if(!gw.length)return '';
   return `<div class="section-label">${g[1]} · ${gw.length} từ</div><div class="grid g3">${gw.map(vocabCard).join('')}</div>`}).join('')
   +`<div class="card card-pad" style="margin-top:20px;font-size:13px;color:var(--ink2)"><b>Cấp độ từ vựng:</b> ${[1,2,3].map(l=>lvBadge(l)+' '+META.levels[l][1]).join(' &nbsp; ')}</div>`;
 }

  const ss=SENTENCES.filter(s=>s[3]===k||(k==='interp'&&s[3]==='core'));
  body=`<div class="card">${ss.map(s=>`<div class="expr-item" style="padding:12px 18px"><div style="flex:1"><div class="zh dlg-zh">${esc(s[0])}</div><div class="dlg-pinyin">${esc(s[1])}</div><div class="vi" style="font-size:13px;margin-top:2px">${esc(s[2])}</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="chip chip-core">${esc(s[4])}</span>${spkBtns(s[0])}</div></div>`).join('')}</div>`;
 }
 if(tab==='dlg'){
  const ds=DIALOGUES.filter(d=>d.ind===k);
  body=ds.length?ds.map(d=>dlgCardHTML(d)).join(''):'<div class="empty">Hội thoại của ngành này nằm trong mục Hội thoại chung.</div>';

 if(tab==='scen'){

  body=`<div class="grid g2">${ss.map(scenCard).join('')}</div>`;
 }
 if(tab==='interp'){

 }
 el.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="GO('careers')">← 4 ngành nghề</button>

 ${body}`;
}

RENDER.phrases=el=>{
 el.innerHTML=pageHead('Professional Phrase Bank','短语','Cụm mở câu chuyên nghiệp','Những "khung câu" giúp lời nói nghe chuyên nghiệp ngay lập tức — dùng trong họp, email và đàm phán.')+
 `<div class="card">${PHRASES.map(p=>`<div class="expr-item" style="padding:12px 18px"><div style="flex:1"><div class="zh dlg-zh">${esc(p[0])}</div><div class="dlg-pinyin">${esc(p[1])}</div><div class="vi" style="font-size:13px;margin-top:2px">${esc(p[2])}</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="chip chip-core">${esc(p[3])}</span>${spkBtns(p[0])}</div></div>`).join('')}</div>`;
};

/* ================= GRAPH ================= */
RENDER.graph=el=>{
 const node=id=>{const n=GRAPH.nodes.find(x=>x.id===id);return n};
 el.innerHTML=pageHead('Vocabulary Knowledge Graph','词图','Bản đồ liên kết từ vựng','Một sự cố sản xuất lan tới đàm phán thương mại như thế nào — nét liền: từ ghép; nét đứt đỏ: chuỗi nhân quả liên ngành. Bấm vào node để mở từ.')+
 `<div class="card card-pad graph-wrap"><svg viewBox="0 0 1050 430" style="min-width:900px;width:100%">
 ${GRAPH.edges.map(e=>{const a=node(e[0]),b=node(e[1]);return `<line class="gedge" x1="${a.x+55}" y1="${a.y}" x2="${b.x-55}" y2="${b.y}"/>`}).join('')}
 ${GRAPH.flows.map(e=>{const a=node(e[0]),b=node(e[1]);return `<line class="gedge flow" x1="${a.x+55}" y1="${a.y}" x2="${b.x-55}" y2="${b.y}" marker-end="url(#garr)"/>`}).join('')}
 <defs><marker id="garr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
 ${GRAPH.nodes.map(n=>{const w=VMAP[n.id];const cvar=`var(--${w.ind==='core'?'ink3':w.ind})`;
  return `<g class="gnode" onclick="openVocab('${w.id}')"><rect x="${n.x-55}" y="${n.y-26}" width="110" height="52" rx="12" fill="var(--surface)" stroke="${cvar}" stroke-width="1.8"/>
  <text x="${n.x}" y="${n.y-4}" text-anchor="middle" font-size="15" font-weight="700" font-family="Noto Sans SC" fill="var(--ink)">${esc(w.h)}</text>
  <text x="${n.x}" y="${n.y+14}" text-anchor="middle" font-size="9.5" fill="var(--ink3)">${esc(w.v.length>14?w.v.slice(0,13)+'…':w.v)}</text></g>`}).join('')}
 </svg></div>
 <div class="card card-pad" style="margin-top:14px;font-size:13.5px;color:var(--ink2)">Đọc chuỗi đỏ từ trái sang phải: <b class="zh">生产</b> chậm → <b class="zh">延迟</b> → ảnh hưởng <b class="zh">交货期</b> → sinh <b class="zh">客户投诉</b> → phải <b class="zh">谈判</b>. Đây chính là lý do 4 ngành phải học lồng ghép: một sự cố ở xưởng kết thúc trên bàn đàm phán.</div>`;
};
</script>
<script>
/* ================= DIALOGUE RENDER ================= */
function dlgLines(d,opts){
 opts=opts||{};
 return `<div class="dlg">${d.lines.map((L,i)=>{
  const me=L[0]===1;
  const av=me?'我':(d.roles[0]||'对')[0];
  const color=me?'var(--accent)':`var(--${d.ind==='core'?'mfg':d.ind})`;
  return `<div class="dlg-line ${me?'me':''}">
   <div class="avatar" style="background:${color}">${av}</div>
   <div class="dlg-bubble">
    <div class="dlg-speaker">${esc(me?(d.roles[1]||'Bạn'):(d.roles[0]||''))}</div>
    <div class="dlg-zh">${esc(L[1])} ${spkBtn(L[1])}</div>
    <div class="dlg-pinyin ${opts.hideP?'':''}" data-tg="p" ${opts.hideP?'hidden':''}>${esc(L[2])}</div>
    <div class="dlg-vi" data-tg="v" ${opts.hideV?'hidden':''}>${esc(L[3])}</div>
   </div></div>`}).join('')}</div>`;
}
function dlgCardHTML(d){
 return `<div class="card card-pad" style="margin-bottom:16px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px">${chip(d.ind)}<span class="chip chip-core">${d.level}</span><span class="chip chip-core">Độ khó ${'★'.repeat(d.diff)}</span></div>
  <b style="font-size:16px">${esc(d.title)}</b> <span class="zh" style="color:var(--ink2)">${esc(d.zh)}</span>
  <div style="font-size:13px;color:var(--ink2);margin:6px 0"><b>Bối cảnh:</b> ${esc(d.ctx)}<br><b>Vai:</b> ${d.roles.join(' ↔ ')} · <b>Mục tiêu:</b> ${esc(d.goal)}</div>
  ${d.vocab&&d.vocab.length?`<div style="margin-bottom:10px">${d.vocab.map(id=>VMAP[id]?`<span class="rel-chip" onclick="openVocab('${id}')">${VMAP[id].h}</span>`:'').join('')}</div>`:''}
  <div class="toggle-row">
   <button class="toggle on" onclick="TGD(this,'p')">Pinyin</button>
   <button class="toggle on" onclick="TGD(this,'v')">Tiếng Việt</button>
   <button class="toggle" onclick="playDlg(this,'${d.id}')">▸ Nghe cả đoạn</button>
  </div>${dlgLines(d)}</div>`;
}
window.TGD=(btn,kind)=>{const on=!btn.classList.contains('on');btn.classList.toggle('on',on);
 btn.closest('.card,.lesson-step,#view-conversations,.view').querySelectorAll(`[data-tg="${kind}"]`).forEach(x=>x.hidden=!on);};
window.playDlg=(btn,id)=>{
 if(btn._playing){window._seqStop=true;try{speechSynthesis.cancel()}catch(e){}btn._playing=false;btn.textContent='▸ Nghe cả đoạn';btn.classList.remove('on');return;}
 const d=DMAP[id];if(!d||!('speechSynthesis' in window)){toast('Trình duyệt không hỗ trợ đọc tiếng Trung');return}
 try{speechSynthesis.cancel()}catch(e){}
 window._seqStop=false;btn._playing=true;btn.textContent='■ Dừng';btn.classList.add('on');
 let i=0;
 const done=()=>{btn._playing=false;btn.textContent='▸ Nghe cả đoạn';btn.classList.remove('on');};
 const next=()=>{if(window._seqStop||i>=d.lines.length){done();return;}
  const u=new SpeechSynthesisUtterance(d.lines[i][1]);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=0.9;
  u.onend=()=>{i++;setTimeout(next,450)};u.onerror=done;speechSynthesis.speak(u);};
 next();S.speak++;save();};

/* ================= CONVERSATIONS VIEW ================= */
RENDER.conversations=el=>{
 el.innerHTML=pageHead('Conversations','对话','Hội thoại theo cấp độ','Mỗi hội thoại có bối cảnh, vai, mục tiêu và từ vựng đi kèm. Phần dưới: cùng một tình huống nói ở 3 trình độ — Basic → Workplace → Professional.')+
 `<div class="section-label">Hội thoại đầy đủ · ${DIALOGUES.length} đoạn</div>`+
 DIALOGUES.map(dlgCardHTML).join('')+
 `<div class="section-label">Cùng một câu — 3 trình độ · 同一情景三个级别</div>
 <div class="grid g2">${LEVELED.map(L=>`
  <div class="card card-pad"><b>${esc(L.sit)}</b> <span class="zh" style="color:var(--ink2)">${esc(L.zh)}</span>
  ${[['Basic','basic','chip-good'],['Workplace','work','chip-trade'],['Professional','pro','chip-nego']].map(t=>{const x=L[t[1]];
   return `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">
    <span class="chip ${t[2]}">${t[0]}</span>
    <div class="zh dlg-zh" style="margin-top:5px">${esc(x.zh)} ${spkBtn(x.zh)}</div>
    <div class="dlg-pinyin">${esc(x.p)}</div><div class="vi" style="font-size:12.5px">${esc(x.vi)}</div></div>`}).join('')}
  </div>`).join('')}</div>`;
};

/* ================= MCQ ENGINE ================= */
function mcqHTML(opts,cb){
 window._mcqCB=cb;
 return `<div class="mcq-box">${opts.map((o,i)=>`
  <button class="mcq-opt" data-i="${i}" onclick="MCQ(this,${o[2]})">
   <span class="key">${'ABCD'[i]}</span>
   <span><span class="zh" style="font-weight:500">${esc(o[0])}</span><br><span class="vi" style="font-size:12.5px">${esc(o[1])}</span></span>
  </button>`).join('')}<div class="mcq-fb"></div></div>`;
}
window.MCQ=(btn,score)=>{
 const box=btn.closest('.mcq-box');if(box._done)return;box._done=true;
 const opts=[...box.querySelectorAll('.mcq-opt')];
 opts.forEach(b=>{b.disabled=true;});
 btn.classList.add(score===2?'correct':'wrong');
 const optData=box._opts;
 const chosen=optData?optData[+btn.dataset.i]:null;
 const best=optData?optData.findIndex(o=>o[2]===2):-1;
 if(score!==2&&best>=0)opts[best].classList.add('correct');
 const fb=box.querySelector('.mcq-fb');
 const msg=chosen&&chosen[3]?chosen[3]:'';
 fb.innerHTML=`<div class="feedback ${score===2?'good':'bad'}">${score===2?'✓ Lựa chọn tốt nhất. ':(score===1?'△ Tạm được, nhưng chưa tối ưu. ':'✕ Chưa ổn. ')}${esc(msg)}</div>`;
 if(window._mcqCB)window._mcqCB(score);
};
function mountMCQ(container,opts,cb){container.innerHTML=mcqHTML(opts,cb);container.querySelector('.mcq-box')._opts=opts;}

/* ================= SCENARIOS ================= */
function scenCard(s){
 const done=S.done.scen[s.id];
 return `<div class="card card-pad" style="cursor:pointer" onclick="openScen('${s.id}')">
  <div style="display:flex;gap:8px;align-items:center">${chip(s.ind)}${done?`<span class="chip chip-good">✓ ${done}/${s.steps.length*2} điểm</span>`:''}</div>
  <b style="display:block;margin-top:6px">${esc(s.title)}</b><span class="zh" style="color:var(--ink2);font-size:13px">${esc(s.zh)}</span>
  <div style="font-size:12.5px;color:var(--ink2);margin-top:6px">${esc(s.ctx)}</div></div>`;
}
window.openScen=id=>{
 const s=SCENARIOS.find(x=>x.id===id);const el=$('#view-careers').classList.contains('active')?$('#view-careers'):$('#view-'+currentView);
 let step=0,score=0;
 const draw=()=>{
  el.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="GO('${currentView}')">← Quay lại</button>
  ${pageHead('Scenario · Tình huống '+(step+1)+'/'+s.steps.length,s.zh.charAt(0),s.title,s.ctx)}
  <div class="bar" style="margin-bottom:18px"><i style="width:${step/s.steps.length*100}%"></i></div>
  <div class="card card-pad"><b style="display:block;margin-bottom:12px">${esc(s.steps[step].prompt)}</b><div class="mcq-slot"></div>
  <div class="lesson-nav"><span></span><button class="btn btn-primary" id="scNext" hidden>Tiếp →</button></div></div>`;
  mountMCQ(el.querySelector('.mcq-slot'),s.steps[step].opts,sc=>{score+=sc;$('#scNext').hidden=false;});
  $('#scNext').onclick=()=>{step++;if(step<s.steps.length)draw();else finish();};
 };
 const finish=()=>{
  const max=s.steps.length*2;S.done.scen[id]=score;save();
  addXP(10+score*3,s.ind==='interp'?'interp':s.ind);
  el.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="GO('${currentView}')">← Quay lại</button>
  <div class="card interp-card"><div class="score-big" style="color:var(--accent)">${score}/${max}</div>
  <p style="color:var(--ink2)">${score===max?'Xuất sắc — bạn xử lý như một nhân viên kỳ cựu.':score>=max*0.6?'Khá tốt! Xem lại phản hồi của các lựa chọn chưa tối ưu.':'Nên làm lại tình huống này — chú ý các phản hồi giải thích.'}</p>
  <div class="srs-btns"><button class="btn" onclick="openScen('${id}')">Làm lại</button><button class="btn btn-primary" onclick="GO('${currentView}')">Hoàn thành</button></div></div>`;
 };
 draw();
};

/* ================= LESSONS ================= */
RENDER.lessons=el=>{
 el.innerHTML=pageHead('Lessons','课程','Bài học 10 bước','Mỗi bài đi trọn một tình huống nghề nghiệp: Context → Vocabulary → Expressions → Dialogue → Listening → Speaking → Interpreter → Scenario → AI Roleplay → Review.')+
 `<div class="grid g3">${LESSONS.map(l=>{
  const done=S.done.lesson[l.id];
  return `<div class="card card-pad" style="cursor:pointer;border-top:3px solid var(--${l.ind})" onclick="GO('lesson','${l.id}')">
   <div style="display:flex;gap:8px">${chip(l.ind)}${done?'<span class="chip chip-good">✓ Hoàn thành</span>':''}</div>
   <b style="display:block;font-size:16px;margin-top:8px">${esc(l.title)}</b>
   <div style="font-size:13px;color:var(--ink2);margin-top:6px">${esc(l.desc)}</div>
   <div style="font-size:12px;color:var(--ink3);margin-top:10px" class="num">~${l.mins} phút · ${l.vocab.length} từ · ${l.expr.length} mẫu câu</div></div>`}).join('')}
 </div>
 <div class="card card-pad" style="margin-top:18px;font-size:13.5px;color:var(--ink2)">Cần thêm bài? Toàn bộ kho nội dung (từ vựng theo nhóm, sentence bank, hội thoại, tình huống, phiên dịch, đàm phán) nằm trong trang từng ngành ở mục <b>4 Ngành nghề</b> — đủ để tự học sâu từng mảng.</div>`;
};

const LSTEPS=['Context','Vocabulary','Expressions','Dialogue','Listening','Speaking','Interpreter','Scenario','Roleplay','Review'];
RENDER.lesson=(el,id)=>{
 const l=LESSONS.find(x=>x.id===id)||LESSONS[0];
 el._st=el._lid===l.id?(el._st||0):0;el._lid=l.id;el._score=el._score||{};
 drawLesson(el,l);
};
function drawLesson(el,l){
 const st=el._st;const d=DMAP[l.dlg];
 let body='';
 if(st===0)body=`<div class="card card-pad"><div class="page-eyebrow">01 · Bối cảnh 情景</div><p style="font-size:15px;line-height:1.7">${esc(l.ctx)}</p>
  <div style="margin-top:14px;font-size:13px;color:var(--ink2)"><b>Bạn sẽ trả lời được:</b> Câu này dùng ở đâu? Nói với ai? Trong tình huống nào? Nếu đối phương phản ứng khác thì sao?</div></div>`;
 if(st===1)body=`<div class="page-eyebrow" style="margin-bottom:10px">02 · Từ vựng ${l.vocab.length} từ — bấm thẻ xem chi tiết, ☆ để lưu</div><div class="grid g3">${l.vocab.map(id=>VMAP[id]?vocabCard(VMAP[id]):'').join('')}</div>`;
 if(st===2)body=`<div class="page-eyebrow" style="margin-bottom:10px">03 · Mẫu câu ${l.expr.length} câu</div><div class="card">${l.expr.map(e=>`<div class="expr-item" style="padding:12px 18px"><div style="flex:1"><div class="zh dlg-zh">${esc(e[0])}</div><div class="dlg-pinyin">${esc(e[1])}</div><div class="vi" style="font-size:13px">${esc(e[2])}</div></div>${spkBtns(e[0])}</div>`).join('')}</div>`;
 if(st===3)body=`<div class="page-eyebrow" style="margin-bottom:10px">04 · Hội thoại thực tế</div>${dlgCardHTML(d)}`;
 if(st===4)body=`<div class="page-eyebrow" style="margin-bottom:10px">05 · Luyện nghe — nghe trước, đọc sau</div>
  <div class="card card-pad"><p style="color:var(--ink2);font-size:13.5px">Bấm nghe cả đoạn (không nhìn chữ). Nghe 2 lần rồi mở chữ đối chiếu.</p>
  <div class="toggle-row" style="margin-top:10px"><button class="toggle" onclick="playDlg(this,'${d.id}')">▸ Nghe cả đoạn</button><button class="toggle" onclick="this.closest('.card').querySelector('.listen-body').hidden=false">Mở nội dung</button></div>
  <div class="listen-body" hidden>${dlgLines(d)}</div></div>`;
 if(st===5)body=`<div class="page-eyebrow" style="margin-bottom:10px">06 · Luyện nói — shadowing từng câu</div>
  <div class="card card-pad"><p style="color:var(--ink2);font-size:13.5px">Nghe từng câu (chuẩn / chậm 0.6x), nói theo, tự ghi âm để so sánh nếu trình duyệt cho phép micro.</p>
  ${l.expr.slice(0,6).map(e=>`<div class="expr-item"><div style="flex:1"><div class="zh dlg-zh">${esc(e[0])}</div><div class="dlg-pinyin">${esc(e[1])}</div></div><div style="display:flex;gap:6px;align-items:center">${spkBtns(e[0])}<button class="speak-btn rec-btn" title="Ghi âm giọng bạn" onclick="recToggle(this)">●</button></div></div>`).join('')}</div>`;
 if(st===6){
  const set=INTERP.find(x=>x.id===l.interp.set);const items=set.items.slice(0,l.interp.n);
  body=`<div class="page-eyebrow" style="margin-bottom:10px">07 · Interpreter Challenge — dịch ${items.length} câu hai chiều</div><div id="lint"></div>`;
  setTimeout(()=>runInterp($('#lint'),items,sc=>{el._score.interp=sc;}),0);
 }
 if(st===7){body=`<div class="page-eyebrow" style="margin-bottom:10px">08 · Xử lý tình huống</div><div class="grid g2">${scenCard(SCENARIOS.find(x=>x.id===l.scen))}</div>`;}
 if(st===8){const rp=ROLEPLAYS.find(x=>x.id===l.rp);
  body=`<div class="page-eyebrow" style="margin-bottom:10px">09 · AI Roleplay</div>
  <div class="card card-pad"><b>${esc(rp.title)}</b> <span class="zh" style="color:var(--ink2)">${esc(rp.zh)}</span>
  <div style="font-size:13px;color:var(--ink2);margin:6px 0">${esc(rp.situation)}</div>
  <button class="btn btn-primary" onclick="GO('roleplay','${rp.id}')">Bắt đầu đối thoại →</button>
  <div style="font-size:12px;color:var(--ink3);margin-top:8px">Làm xong quay lại bài học để hoàn tất bước Review.</div></div>`;}
 if(st===9){
  const done=S.done.lesson[l.id];
  body=`<div class="page-eyebrow" style="margin-bottom:10px">10 · Review & cách nói chuyên nghiệp hơn</div>
  <div class="card card-pad"><b>Say it more professionally · 更专业的说法</b>
  ${l.pro.map(p=>`<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">
   <div style="font-size:13px"><span class="chip chip-nego">Tránh</span> <span class="zh">${esc(p[0])}</span> <span class="vi">— ${esc(p[1])}</span></div>
   <div style="font-size:13px;margin-top:6px"><span class="chip chip-good">Nên</span> <span class="zh">${esc(p[2])}</span> ${spkBtn(p[2])} <span class="vi">— ${esc(p[3])}</span></div></div>`).join('')}
  </div>
  <div class="card card-pad" style="margin-top:14px;text-align:center">
   ${done?`<p style="color:var(--good);font-weight:700">✓ Bài học đã hoàn thành</p>`:`<button class="btn btn-primary" onclick="finishLesson('${l.id}')">Hoàn thành bài học · +25 XP</button>`}
  </div>`;
 }

/* recorder */
let _rec=null,_chunks=[],_lastURL=null;
window.recToggle=async btn=>{
 try{
  if(_rec&&_rec.state==='recording'){_rec.stop();btn.textContent='●';btn.classList.remove('playing');return;}
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  _chunks=[];_rec=new MediaRecorder(stream);
  _rec.ondataavailable=e=>_chunks.push(e.data);
  _rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(_chunks);if(_lastURL)URL.revokeObjectURL(_lastURL);_lastURL=URL.createObjectURL(blob);new Audio(_lastURL).play();toast('Đang phát lại giọng của bạn…')};
  _rec.start();btn.textContent='■';btn.classList.add('playing');toast('Đang ghi âm — bấm lại để dừng & nghe');
 }catch(e){toast('Không truy cập được micro — hãy cho phép micro trong trình duyệt');}
};

 };

}

function runRP(el,id){

 let node=r.start,picks=[],scores=[];
 el.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="GO('roleplay')">← Kịch bản khác</button>

 window.RPBRIEF=()=>{
  $('#modalBox').innerHTML=`<button class="modal-close" onclick="closeModal()">✕</button>
  <b style="font-size:17px">${esc(r.title)}</b><div class="zh" style="color:var(--ink2)">${esc(r.zh)}</div>

 };
 RPBRIEF();
 const log=$('#rplog'),input=$('#rpin');
 const aiSay=n=>{
  const N=r.nodes[n];
  const typing=document.createElement('div');typing.className='dlg-line';typing.innerHTML=`<div class="avatar" style="background:${c.color}">${c.hanzi}</div><div class="dlg-bubble typing"><i></i><i></i><i></i></div>`;

  setTimeout(()=>{
   typing.remove();
   const b=document.createElement('div');b.className='dlg-line';

   input.innerHTML=`<div style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Bạn trả lời — chọn và ĐỌC TO câu đó</div>`+

  const dims=[['Vocabulary 词汇',Math.min(98,60+pct*0.35)],['Grammar 语法',Math.min(96,62+pct*0.3)],['Professional Chinese 职场中文',Math.round(pct*0.9+5)],['Negotiation 谈判',Math.round(pct*0.95)],['Response 反应',Math.min(95,58+pct*0.35)]];
  const overall=Math.round(dims.reduce((a,d)=>a+d[1],0)/dims.length);
  if(!S.done.rp[r.id]||S.done.rp[r.id]<overall)S.done.rp[r.id]=overall;

  const fixes=picks.filter(p=>p.o.s<2&&p.o.fb);
  input.innerHTML=`<div style="text-align:center;padding:6px 0"><b style="color:${win?'var(--good)':'var(--bad)'}">${win?'✓ Đạt thỏa thuận':'✕ Kết cục bất lợi'}</b> — xem báo cáo bên dưới</div>`;
  const rep=document.createElement('div');rep.className='card card-pad';rep.style.marginTop='14px';
  rep.innerHTML=`<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
   <div class="score-big" style="color:var(--accent)">${overall}<span style="font-size:18px;color:var(--ink3)">/100</span></div>
   <div style="flex:1;min-width:240px">${dims.map(d=>`<div class="score-row"><b>${d[0]}</b><div class="bar"><i style="width:${d[1]}%"></i></div><span class="num">${Math.round(d[1])}</span></div>`).join('')}</div></div>
  ${fixes.length?`<div class="section-label">AI phân tích — câu nên nói khác đi</div>${fixes.map(f=>{
   const best=r.nodes[f.n].opts.find(o=>o.s===2);

   <div><span class="chip chip-nego">Bạn nói</span> <span class="zh">${esc(f.o.zh)}</span></div>
   <div style="color:var(--warn);margin:4px 0 4px 4px">→ ${esc(f.o.fb)}</div>
   ${best?`<div><span class="chip chip-good">Chuyên nghiệp hơn</span> <span class="zh">${esc(best.zh)}</span> ${spkBtn(best.zh)}</div>`:''}</div>`}).join('')}`:'<div style="margin-top:12px;color:var(--good);font-weight:600">Bạn chọn phương án tối ưu ở mọi bước — 完美！</div>'}

  log.appendChild(rep);log.scrollTop=log.scrollHeight;
 };
 aiSay(node);
